<title>热门游戏·AI资讯监控</title>
<script>
// 防御: 标签外误入的杂散文本会被浏览器挪进 body 开头,自动清除
document.addEventListener('DOMContentLoaded', function () {

<style>
:root{
  --bg:#FAFAF8;--card:#FFFFFF;--card-hover:#FFFDF5;
  --border:#E8E4DC;--border-light:#F0ECE4;
  --ink:#1A1A1A;--ink2:#4A4A4A;--ink3:#8A8A8A;
  --gold:#C49B2C;--gold-light:#F5EDD4;--gold-border:#E2D5A0;
  --gold-gradient:linear-gradient(135deg, #C49B2C, #D4AF37, #B8860B);
  --ai:#6C5CE7;--ai-light:#EEEBFB;--ai-border:#C8BFF5;
  --red:#C0392B;--red-light:#FDEEEC;--red-border:#F0B8B2;
  --green:#27AE60;--green-light:#E8F8F0;--green-border:#A3E4C1;
  --blue:#2980B9;--blue-light:#EBF5FB;--blue-border:#A9D4F0;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);
  --shadow-hover:0 4px 16px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.05);
  --font-serif:'Noto Serif SC',serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.7;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg, rgba(196,155,44,.03) 0%, transparent 300px);pointer-events:none;z-index:-1}
.wrap{max-width:62vw;margin:0 auto;padding:0 24px 80px}

/* Top nav */
.top-nav{display:flex;gap:0;border-bottom:2px solid var(--border);max-width:62vw;margin:0 auto;padding:0 24px}
.top-nav-item{font-size:14px;font-weight:700;padding:14px 22px;cursor:pointer;color:var(--ink3);border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:all .25s;text-decoration:none;letter-spacing:.5px;font-family:var(--font-serif)}
.top-nav-item:hover{color:var(--ink)}
.top-nav-item.active{color:var(--gold);border-bottom-color:var(--gold)}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header-inner{max-width:62vw;margin:0 auto;padding:18px 24px 0}
.masthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.masthead h1{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:.5px;font-family:var(--font-serif)}
.masthead h1 span{color:var(--gold)}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:20px;padding:7px 16px;background:var(--card);transition:all .25s;box-shadow:0 1px 4px rgba(0,0,0,.02)}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,155,44,.08)}
.search svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2}
.search input{border:0;background:transparent;outline:0;font-size:13px;color:var(--ink);width:160px}
.search input::placeholder{color:var(--ink3)}

/* Category tabs */
.cat-tabs{display:flex;gap:8px;padding-bottom:14px}
.cat-tab{font-size:13px;font-weight:600;padding:7px 18px;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--ink2);transition:all .25s;text-decoration:none}
.cat-tab:hover{border-color:var(--gold-border);background:var(--gold-light);transform:translateY(-1px)}
.cat-tab.on{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 3px 12px rgba(196,155,44,.25)}
.cat-tab .count{font-size:11px;opacity:.7;margin-left:4px}

/* Date strip */
.datestrip{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin:20px 0 24px;padding:4px 0 12px;scrollbar-width:thin}
.datestrip::-webkit-scrollbar{height:4px}
.datestrip::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.datestrip button{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;cursor:pointer;color:var(--ink);font-size:12px;font-weight:600;transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;box-shadow:var(--shadow)}
.datestrip button:hover{border-color:var(--gold-border);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.datestrip button.on{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 4px 16px rgba(196,155,44,.3);transform:scale(1.05)}
.datestrip button .weekday{font-size:10px;opacity:.6;font-weight:400}
.datestrip button.nodata{opacity:.35;cursor:default;box-shadow:none}
.datestrip button.nodata:hover{border-color:var(--border);transform:none;box-shadow:none}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:14px;padding:24px 28px;margin:16px 0;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow);opacity:0;animation:cardFadeIn .5s ease forwards}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--gold-border)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-idx{font-weight:800;font-size:11px;letter-spacing:.5px;padding:3px 8px;border-radius:4px}
.badge{font-size:10.5px;font-weight:600;color:var(--ink2);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 8px}
.card h2{font-size:17px;margin:8px 0;color:var(--ink);line-height:1.5;font-weight:700;font-family:var(--font-serif)}
.card .en-title{font-size:11.5px;color:var(--ink3);font-style:italic;margin-bottom:12px;line-height:1.5}
.card .link{font-size:11.5px;margin:8px 0 14px;word-break:break-all}
.card .link a{color:var(--gold);text-decoration:none;font-weight:500;transition:color .2s}
.card .link a:hover{color:#A07B1A;text-decoration:underline}
.card .media{margin:16px 0;border-radius:12px;overflow:hidden;border:1px solid var(--border-light)}
.card .media img{width:100%;max-height:360px;object-fit:cover;display:block}
.card .media video{width:100%;max-height:360px;display:block}
.card .field{margin:12px 0}
.card .lab{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;padding:2px 6px;border-radius:3px}
.card .lab.summary{color:var(--gold);background:var(--gold-light)}
.card .lab.analysis{color:var(--blue);background:var(--blue-light)}
.card .lab.game-intro{color:var(--gold);background:var(--gold-light)}
.card .val{margin:4px 0 0;color:var(--ink2);font-size:14px;line-height:1.8;white-space:pre-line}

/* Card entrance animation */
@keyframes cardFadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.2s}
.card:nth-child(5){animation-delay:.25s}
.card:nth-child(6){animation-delay:.3s}

/* Expand/collapse full tweet */
.expand-wrap{margin:10px 0;text-align:center}
.expand-btn,.collapse-btn{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;color:var(--ink3);padding:5px 12px;border-radius:6px;transition:all .2s;border:1px solid transparent}
.expand-btn:hover,.collapse-btn:hover{color:var(--gold);background:var(--gold-light);border-color:var(--gold-border)}
.expand-arrow{font-size:9px}
.expand-content{display:none;margin:10px 0;padding:14px 16px;background:var(--bg);border:1px solid var(--border-light);border-radius:8px;text-align:left;font-size:13px;color:var(--ink2);line-height:1.7;font-style:italic;white-space:pre-line}
.collapse-btn{display:none}
.expand-wrap.open .expand-btn{display:none}
.expand-wrap.open .expand-content{display:block}
.expand-wrap.open .collapse-btn{display:inline-flex}

/* Section heading (hidden when tab filtering, shown for "all") */
.sec-heading{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:32px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;color:var(--ink3);font-family:var(--font-serif)}
.sec-dot{width:8px;height:8px;border-radius:50%}

/* Empty / loading */
.loading{text-align:center;color:var(--ink3);padding:60px 0;font-size:14px}
.no-results{text-align:center;color:var(--ink3);padding:40px 0;font-size:14px;display:none}

/* Footer */
footer{margin-top:48px;text-align:center;color:var(--ink3);font-size:11.5px;padding:24px 0;border-top:1px solid var(--border)}

/* Roblox weekly report */
.roblox-view{display:none;max-width:none;margin:0;background:#f6f0e8;color:#3c2b27;font-family:"Nunito Sans","Microsoft YaHei",sans-serif}
.roblox-view.active{display:block}
.roblox-view-inner{min-height:calc(100vh - 66px);padding:0 7vw 96px;background:#f6f0e8}
.roblox-switcher{margin:0 -7vw 34px;padding:0;background:#fffaf4;border:0;border-bottom:1px solid rgba(60,43,39,.14);box-shadow:0 10px 28px rgba(91,52,46,.06)}
.roblox-switch-inner{max-width:1220px;margin:0 auto;padding:26px 32px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
.roblox-kicker{color:#873026;text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:900;margin-bottom:8px}
.roblox-title{margin:0;font-family:var(--font-serif);font-size:clamp(28px,3.6vw,52px);font-weight:700;line-height:1.08;letter-spacing:0;color:#3c2b27}

.roblox-weeks{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.roblox-week-btn{min-height:40px;padding:0 18px;border:1px solid rgba(60,43,39,.14);border-radius:8px;background:#fff;color:#3c2b27;font-size:13px;font-weight:900;cursor:pointer;transition:all .22s ease;box-shadow:0 5px 14px rgba(91,52,46,.05);display:inline-flex;align-items:center;justify-content:center;line-height:1;font-family:"Nunito Sans","Microsoft YaHei",sans-serif}
.roblox-week-btn:hover{background:#A33A2F;border-color:#A33A2F;color:#fffaf4}

.ld-pager{display:flex;align-items:center;gap:8px;margin-right:auto}
.ld-page-info{color:#8b7169;font-size:11.5px;font-weight:900;white-space:nowrap}
.roblox-week-btn.on{background:#C63C2F;border-color:#C63C2F;color:#fff;box-shadow:0 12px 24px rgba(198,60,47,.18)}
.roblox-report-host{max-width:1220px;margin:0 auto;color:#3c2b27;animation:cardFadeIn .38s ease both}
.roblox-report-host .page{max-width:none;margin:0;padding:0;position:relative;z-index:1}
.roblox-report-host .header{margin:0 0 52px;padding:52px 56px 0;border-radius:0;background:#A33A2F;color:#fff;box-shadow:0 24px 55px rgba(102,42,35,.13);position:relative;overflow:hidden}

.roblox-report-host .header-badge,.roblox-report-host .exec-label,.roblox-report-host .ar-label,.roblox-report-host .insight-label{display:inline-flex;align-items:center;gap:10px;color:#873026!important;background:#fffaf4!important;border:1px solid rgba(255,255,255,.42)!important;border-radius:0!important;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:900;padding:6px 12px;margin-bottom:16px}

.roblox-report-host .header h1{position:relative;max-width:920px;margin:0;font-family:var(--font-serif);font-size:clamp(34px,5vw,72px);font-weight:700;line-height:1.08;letter-spacing:0;color:#fff}

.roblox-report-host .watch-item{margin-bottom:14px;border-left:4px solid #873026}.roblox-report-host .watch-item .wi-num{font-family:var(--font-serif);font-size:20px;font-weight:900;color:#873026}.roblox-report-host .watch-item h4{font-size:20px;margin:6px 0}

.roblox-report-host .footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.roblox-report-host .footer-col h4{color:#873026;font-size:11px;letter-spacing:.14em;text-transform:uppercase}.roblox-report-host .footer-bottom{border-top:1px solid rgba(60,43,39,.12);color:#8b7169}
.roblox-loading,.roblox-error{max-width:1220px;margin:0 auto;padding:48px 28px;border:1px dashed rgba(135,48,38,.24);background:rgba(255,250,244,.58);color:#8b7169;text-align:center;font-size:14px;font-weight:900}

/* Enrichment - Game Showcase (4-zone layout, integrated into card) */
.card-enriched{padding:24px 32px}
.enrichment{margin-top:16px;padding:0;border-radius:12px;overflow:hidden;border:1px solid var(--border-light);background:var(--bg)}
.enrich-grid{display:grid;grid-template-columns:1.3fr 0.7fr;grid-template-rows:1fr auto;gap:0}
.enrich-media{grid-column:1;grid-row:1/3;border-right:1px solid var(--border-light);position:relative;overflow:hidden;min-height:260px;background:#0a0a0a}
.enrich-media img,.enrich-media video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.enrich-media:hover img{transform:scale(1.02)}
.enrich-media a{display:block;width:100%;height:100%}
.enrich-media .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.4) 100%);transition:background .3s}
.enrich-media:hover .play-overlay{background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.5) 100%)}
.enrich-media .play-overlay span{width:60px;height:60px;background:rgba(255,255,255,.95);color:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .2s}
.enrich-media:hover .play-overlay span{transform:scale(1.1)}
.enrich-data{grid-column:2;grid-row:1;padding:22px 20px;display:flex;flex-direction:column;gap:14px;justify-content:center;background:linear-gradient(180deg,var(--card) 0%,var(--bg) 100%)}
.enrich-data.has-intro{justify-content:flex-start;align-items:stretch;background:#fff}
.enrich-stat{display:flex;flex-direction:column;gap:2px}
.enrich-stat-label{font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3)}
.enrich-stat-value{font-size:22px;font-weight:900;color:var(--ink);font-family:var(--font-serif);line-height:1.2}
.enrich-stat-value.gold{color:var(--gold)}
.enrich-nodata{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px}
.enrich-nodata span{font-size:28px;font-weight:800;color:var(--ink3);opacity:.6;letter-spacing:2px}
.enrich-tags-zone{grid-column:2;grid-row:2;padding:14px 20px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;border-top:1px solid var(--border-light)}
.enrich-tags-zone .enrich-tag{font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:12px;background:var(--green-light);color:var(--green);border:1px solid var(--green-border);transition:transform .15s}
.enrich-tags-zone .enrich-tag:hover{transform:translateY(-1px)}
.enrich-tags-zone .enrich-tag.platform{background:var(--blue-light);color:var(--blue);border-color:var(--blue-border)}

.enrich-section-label{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;padding:2px 6px;border-radius:3px;color:var(--gold);background:var(--gold-light)}
.enrich-desc{font-size:13px;color:var(--ink2);line-height:1.8;white-space:pre-line}
.enrich-intro-card{display:flex;flex-direction:column;height:100%;min-height:0}
.enrich-intro-card .enrich-section-label{align-self:flex-start;margin-bottom:0;background:#A33A2F;color:#fff}
.enrich-info-list{display:flex;flex-direction:column;gap:12px;max-height:310px;overflow:auto;padding-right:4px}
.enrich-info-item{padding-bottom:11px;border-bottom:1px solid rgba(60,43,39,.1)}
.enrich-info-item:last-child{padding-bottom:0;border-bottom:0}
.enrich-info-label{display:block;margin-bottom:4px;color:#8b7169;font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.enrich-info-value{display:block;color:#3c2b27;font-size:14px;line-height:1.65;font-weight:800;white-space:pre-line}
.enrich-info-value.is-status,.enrich-info-value.is-metric{color:#873026;font-family:var(--font-serif);font-size:22px;line-height:1.35;font-weight:900}
.enrich-info-value.is-positioning{color:#5f4a44;font-size:13.5px;line-height:1.78;font-weight:700}
.enrich-highlight{font-size:13px;color:var(--ink);font-weight:600;margin-top:14px;padding:10px 14px;background:linear-gradient(90deg,var(--gold-light) 0%,transparent 80%);border-left:3px solid var(--gold);border-radius:4px;line-height:1.6}
.game-intro-field{margin:14px 0 18px}.game-intro-field .val{white-space:pre-line}
.game-intro-field .enrich-highlight{background:linear-gradient(90deg,var(--red-light) 0%,transparent 80%);border-left-color:#A33A2F;color:#3c2b27}
.enrich-tags-zone .enrich-tag.steam-link{background:var(--gold-light);color:var(--gold);border-color:var(--gold-border);text-decoration:none;cursor:pointer}
.enrich-stat-sub{font-size:11px;color:var(--ink3);font-weight:600;margin-top:2px}
@media(max-width:900px){
  .wrap,.top-nav,.header-inner{max-width:100%}
}
@media(max-width:700px){
  .card-enriched{padding:16px}
  .enrich-grid{grid-template-columns:1fr;grid-template-rows:auto}
  .enrich-media{grid-column:1;grid-row:1;min-height:180px;border-right:none}
  .enrich-data{grid-column:1;grid-row:2;flex-direction:row;flex-wrap:wrap;gap:16px;padding:16px 20px}
  .enrich-data.has-intro{flex-direction:column;flex-wrap:nowrap}
  .enrich-tags-zone{grid-column:1;grid-row:3}

/* Digest */
.digest{background:var(--card);border:1px solid var(--gold-border);border-radius:14px;padding:24px 28px;margin-bottom:28px;box-shadow:0 2px 12px rgba(196,155,44,.06)}
.digest-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:8px;font-family:var(--font-serif)}
.digest-title::before{content:"";display:inline-block;width:20px;height:2.5px;background:var(--gold-gradient);border-radius:2px}
.digest-grid{display:flex;flex-direction:column;gap:14px}
.digest-item{padding:16px 20px;border-radius:10px;border-left:3px solid var(--gold);background:var(--gold-light);cursor:pointer;transition:all .25s}
.digest-item:hover{transform:translateX(3px);box-shadow:0 3px 12px rgba(196,155,44,.12)}
.digest-item .di-label{font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:8px;font-family:var(--font-serif)}
.digest-item .di-lines{display:flex;flex-direction:column;gap:2px}
.di-line{font-size:13px;color:var(--ink2);line-height:1.6;padding:6px 10px;border-radius:6px;cursor:pointer;transition:all .2s}
.di-line:hover{background:rgba(196,155,44,.08)}

/* Daily Summary */
.daily-summary{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:14px;padding:28px 32px;margin-bottom:24px;box-shadow:var(--shadow)}
.daily-summary-title{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:10px;font-family:var(--font-serif)}
.daily-summary-title::before{content:"";display:inline-block;width:24px;height:3px;background:var(--gold-gradient);border-radius:2px}
.daily-summary-body{font-size:14.5px;color:var(--ink2);line-height:1.9;white-space:pre-line}
.daily-summary-body strong{color:var(--ink);font-weight:700;font-family:var(--font-serif)}

/* === NEW: Digest V2 - Three Zone Layout === */

/* Zone A: Lede */
.lede-section{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:14px;padding:28px 32px;margin-bottom:28px;box-shadow:var(--shadow);animation:cardFadeIn .4s ease forwards;opacity:0}
.lede-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lede-date{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-family:var(--font-serif)}
.lede-date::before{content:"";display:inline-block;width:20px;height:2.5px;background:var(--gold-gradient);border-radius:2px;margin-right:6px}
.lede-count{font-size:11px;color:var(--ink3);font-weight:600}
.lede-body{font-size:17px;color:var(--ink);line-height:2;font-family:var(--font-serif);font-weight:600;white-space:pre-line}

/* Zone B: Hero Cards */
.hero-section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;animation:cardFadeIn .5s ease forwards;animation-delay:.1s;opacity:0}
.hero-section.single{grid-template-columns:1fr}
.hero-section.triple{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
.hero-section.triple .hero-card:first-child{grid-column:1/3}
.hero-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:all .3s cubic-bezier(.4,0,.2,1);cursor:pointer}
.hero-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
.hero-cover{position:relative;width:100%;height:220px;overflow:hidden;background:#111}
.hero-cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.hero-card:hover .hero-cover img{transform:scale(1.04)}
.hero-cover-gradient{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.7) 100%);pointer-events:none}
.hero-cover-badge{position:absolute;top:14px;left:14px;font-size:10px;font-weight:700;letter-spacing:1px;padding:4px 10px;border-radius:6px;color:#fff;text-transform:uppercase}
.hero-cover-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#111;padding-left:3px;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .2s}
.hero-card:hover .hero-cover-play{transform:translate(-50%,-50%) scale(1.1)}
.hero-body{padding:20px 22px 22px}
.hero-hook{font-size:16px;font-weight:700;line-height:1.55;color:var(--ink);font-family:var(--font-serif);margin-bottom:10px}
.hero-summary{font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink3)}
.hero-meta-left{display:flex;align-items:center;gap:8px}
.hero-meta-left img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.hero-meta-link{color:var(--gold);font-weight:600;font-size:12px;text-decoration:none;transition:color .2s}
.hero-meta-link:hover{color:#A07B1A}

/* Zone C: Compact Digest List */
.digest-list-section{animation:cardFadeIn .5s ease forwards;animation-delay:.2s;opacity:0}
.digest-list-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.digest-list-title::before{content:"";display:inline-block;width:16px;height:2px;background:var(--border);border-radius:2px}
.digest-group{margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.digest-group-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 2px}
.digest-group-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.digest-group-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--ink3);font-family:var(--font-serif)}
.digest-row{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.digest-row:hover{background:var(--gold-light);border-color:var(--gold-border);transform:translateX(3px)}
.digest-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg);border:1px solid var(--border-light)}
.digest-thumb-placeholder{width:44px;height:44px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--bg) 0%,var(--border-light) 100%);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--ink3);opacity:.4;border:1px solid var(--border-light)}
.digest-row-content{flex:1;min-width:0}
.digest-row-hook{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.digest-row-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.digest-row-arrow{font-size:13px;color:var(--gold);flex-shrink:0;transition:transform .2s;opacity:.6}
.digest-row:hover .digest-row-arrow{transform:translateX(3px);opacity:1}
.digest-steam-link{color:var(--gold);font-weight:600;text-decoration:none;transition:color .2s}
.digest-steam-link:hover{color:#A07B1A;text-decoration:underline}

@media(max-width:700px){
  .hero-section{grid-template-columns:1fr}

<script>
const BASE = 'data/';
let manifest = null;
let currentDate = null;
let currentData = null;

let currentView = 'twitter';
const reportCache = new Map();
const robloxReportCache = new Map();
let activeRobloxReportIndex = -1;
let twitterWeeklyData = null;
let activeTwitterWeeklyIndex = -1;

let editorialDigestReturnScrollY = 0;
let editorialDigestReturnDate = '';

let twitterWeeklyReturnIndex = -1;
let twitterWeeklyReturnPending = false;

// Roblox weekly reports (add new ones here)
const robloxReports = [
  { label: '6.1 - 6.7', file: 'roblox/roblox-2026-06-01-to-06-07.html' },
  { label: '6.15 - 6.21', file: 'roblox/roblox-2026-06-15-to-06-21.html' },
  { label: '6.22 - 6.28', file: 'roblox/roblox-2026-06-22-to-06-28.html' },
  { label: '6.29 - 7.5', file: 'roblox/roblox-2026-06-29-to-07-05.html' },
  { label: '7.6 - 7.12', file: 'roblox/roblox-2026-07-06-to-07-12.html' },
  { label: '7.13 - 7.19', file: 'roblox/roblox-2026-07-13-to-07-19.html' },
  { label: '7.20 - 7.26', file: 'roblox/roblox-2026-07-20-to-07-26.html' },
  { label: '7.27 - 8.2', file: 'roblox/roblox-2026-07-27-to-08-02.html' }
];

function switchView(view) {
  currentView = view;
  document.body.classList.toggle('editorial-mode', true);
  document.body.classList.toggle('roblox-mode', view === 'roblox');
  document.getElementById('navTwitter').classList.toggle('active', view === 'twitter');
  document.getElementById('navRoblox').classList.toggle('active', view === 'roblox');
  const navLaunchedEl = document.getElementById('navLaunched');
  if (navLaunchedEl) navLaunchedEl.classList.toggle('active', view === 'launched');
  document.getElementById('navLibrary').classList.toggle('active', view === 'library');
  document.getElementById('twitterView').style.display = view === 'twitter' ? '' : 'none';
  document.getElementById('robloxView').classList.toggle('active', view === 'roblox');
  document.getElementById('launchedView').classList.toggle('active', view === 'launched');
  document.getElementById('libraryView').classList.toggle('active', view === 'library');
  if (view !== 'twitter') {
    resetGlobalSearchMode(true);
    if (view === 'roblox') renderRoblox();
    if (view === 'launched') renderLaunched();
    if (view === 'library') renderLibrary();
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 30);
  }
}

function renderRoblox() {
  document.getElementById('robloxEditorialNav').innerHTML = `<nav class="ed-top-nav" aria-label="日报与周报导航">${renderEditorialTopNav()}</nav>`;
  const container = document.getElementById('robloxWeeks');
  container.innerHTML = robloxReports.map((r, i) =>
    `<button class="roblox-week-btn ${i === robloxReports.length - 1 ? 'on' : ''}" onclick="loadRoblox(${i})">${r.label}</button>`
  ).join('');
  loadRoblox(robloxReports.length - 1);
  setTimeout(scrollEditorialActiveNavIntoView, 30);
}

async function loadRoblox(idx) {
  const report = robloxReports[idx];
  const host = document.getElementById('robloxReportHost');
  activeRobloxReportIndex = idx;
  document.querySelectorAll('.roblox-week-btn').forEach((b, i) => b.classList.toggle('on', i === idx));
  host.innerHTML = '<div class="roblox-loading">周报加载中...</div>';
  try {
    const html = await fetchRobloxReport(report.file);
    if (activeRobloxReportIndex !== idx) return;
    host.innerHTML = extractRobloxReportBody(html);
    document.querySelectorAll('.roblox-report-host script').forEach(node => node.remove());
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 30);
  } catch(e) {
    if (activeRobloxReportIndex !== idx) return;
    host.innerHTML = `<div class="roblox-error">ROBLOX 周报加载失败<br><small>${escapeHtml(e.message)}</small></div>`;
  }
}

async function fetchRobloxReport(file) {
  if (robloxReportCache.has(file)) return robloxReportCache.get(file);
  const res = await fetch(file + '?v=' + Date.now());
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const html = await res.text();
  robloxReportCache.set(file, html);
  return html;
}

function extractRobloxReportBody(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const page = doc.querySelector('.page');
  if (!page) throw new Error('缺少周报主体');
  page.querySelectorAll('[style]').forEach(node => {
    const barWidth = node.classList.contains('rank-bar-fill') ? node.style.width : '';
    node.removeAttribute('style');
    if (barWidth) node.style.width = barWidth;
  });
  return page.outerHTML;
}

    renderDateStrip();

}

function renderDateStrip() {
  const strip = document.getElementById('dateStrip');
  strip.innerHTML = '';
  const available = new Set(manifest.dates);
  // Always show: today back to 14 days ago (or earliest data, whichever is further)
  const today = new Date();
  today.setHours(0,0,0,0);
  const earliest = manifest.dates.length ? new Date(manifest.dates[0]) : today;
  const daysBack = Math.max(14, Math.ceil((today - earliest) / 86400000) + 3);
  const start = new Date(today);
  start.setDate(start.getDate() - daysBack);

  const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
  const dates = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    dates.push(`${yyyy}-${mm}-${dd}`);
  }

  dates.forEach(d => {
    const btn = document.createElement('button');
    const dt = new Date(d);
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    const wd = dayNames[dt.getDay()];
    btn.innerHTML = `<span class="weekday">${wd}</span>${mm}-${dd}`;
    btn.title = d;
    btn.dataset.date = d;
    const hasData = available.has(d);
    if (!hasData) {
      btn.classList.add('nodata');
    } else {
      btn.onclick = () => loadDate(d);
    }
    strip.appendChild(btn);
  });

  // Scroll to rightmost (today)
  setTimeout(() => {
    strip.scrollLeft = strip.scrollWidth;
  }, 50);
}

async function loadDate(date, options = {}) {
  const requestedTab = options.preserveTab ? currentTab : (options.tab || 'digest');
  currentDate = date;
  currentTab = requestedTab;
  if (!options.keepSearch) resetGlobalSearchMode(true);
  document.querySelectorAll('.datestrip button').forEach(b => {
    b.classList.toggle('on', b.dataset.date === date);
  });
  document.getElementById('content').innerHTML = '<div class="loading">加载中...</div>';

  try {
    const res = await fetch(BASE + date + '.json?v=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    currentData = await res.json();
    reportCache.set(date, currentData);
    const validTabs = new Set(['digest', 'weekly', 'ai', 'industry', 'indie']);
    if (!validTabs.has(currentTab)) currentTab = 'digest';
    renderTabs();
    document.getElementById('digestV2').style.display = '';
    document.getElementById('dailySummary').style.display = 'none';
    document.getElementById('digest').style.display = 'none';
    document.getElementById('content').innerHTML = '';

}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getSectionById(id) {
  return currentData.sections.find(section => section.id === id);
}

function getCover(item) {
  return (item && item.media && item.media.url) || (item && item.enrichment && item.enrichment.header_image) || '';
}

function renderEditorialHeroPhoto(item, title) {
  const cover = getCover(item);
  const fallbackTitle = formatEditorialHeroTitle(title || (item && (item.recommendation || item.title)) || '');
  const fallbackAttr = escapeHtml(fallbackTitle);
  if (!cover) {
    return `<div class="ed-hero-photo is-missing" data-fallback-title="${fallbackAttr}"></div>`;
  }
  return `<div class="ed-hero-photo" data-fallback-title="${fallbackAttr}"><img src="${escapeHtml(cover)}" alt="${escapeHtml((item && item.title) || fallbackTitle)}" onerror="this.parentElement.classList.add('is-missing');this.remove()"></div>`;
}

function formatCount(value) {
  const num = Number(value || 0);
  if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (num >= 1000) return (num / 1000).toFixed(num >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return num.toLocaleString();
}

function findPick(sectionId, fallbackIndex) {
  const section = getSectionById(sectionId);
  if (!section || !section.items.length) return null;
  const explicit = currentData.editors_pick && currentData.editors_pick.find(pick => pick.section_id === sectionId && section.items[pick.item_index]);
  const item = explicit ? section.items[explicit.item_index] : section.items[fallbackIndex || 0];
  return { section, item, itemIndex: section.items.indexOf(item), hook: (explicit && explicit.hook) || item.recommendation || item.title };
}

function findExplicitPick(filterFn) {
  if (!currentData.editors_pick) return null;
  for (const pick of currentData.editors_pick) {
    const section = getSectionById(pick.section_id);
    const item = section && section.items[pick.item_index];
    if (!item) continue;
    const result = { section, item, itemIndex: pick.item_index, hook: pick.hook || item.recommendation || item.title };
    if (!filterFn || filterFn(result)) return result;
  }
  return null;
}

function getEditorialHeatScore(item) {
  return Number((item && item.views) || 0) + Number((item && item.likes) || 0) * 100;
}

function findHottestPick(sectionIds) {
  const candidates = [];
  sectionIds.forEach(sectionId => {
    const section = getSectionById(sectionId);
    if (!section || !section.items) return;
    section.items.forEach((item, itemIndex) => {
      candidates.push({
        section,
        item,
        itemIndex,
        hook: item.recommendation || item.title,
        score: getEditorialHeatScore(item)
      });
    });
  });
  candidates.sort((a, b) => b.score - a.score);
  return candidates[0] || null;
}

function findEditorialHeroPicks() {
  const firstSectionId = (currentData.sections[0] || {}).id;

  // Priority: use explicit editors_pick if available
  if (currentData.editors_pick && currentData.editors_pick.length) {
    let aiPick = null, gamePick = null;
    for (const pick of currentData.editors_pick) {
      const section = getSectionById(pick.section_id);
      const item = section && section.items[pick.item_index];
      if (!item) continue;
      const result = { section, item, itemIndex: pick.item_index, hook: pick.hook || item.recommendation || item.title };
      if (!aiPick && (pick.section_id === 'ai' || pick.section_id === 'tools')) { aiPick = result; }
      else if (!gamePick) { gamePick = result; }
    }
    // If editors_pick only specified one, fill the other with hottest
    if (!aiPick) aiPick = findHottestPick(['ai', 'tools']) || findPick(firstSectionId, 0);
    if (!gamePick) gamePick = findHottestPick(['indie']) || findPick('indie', 0) || findPick(((currentData.sections[1] || currentData.sections[0]) || {}).id, 0);
    return { aiPick, gamePick };
  }

  // Fallback: hottest by score
  const aiPick = findHottestPick(['ai', 'tools']) || findPick(firstSectionId, 0);
  const gamePick = findHottestPick(['indie']) || findPick('indie', 0) || findPick(((currentData.sections[1] || currentData.sections[0]) || {}).id, 0);
  return { aiPick, gamePick };
}

function getDisplayDates() {
  const availableDates = manifest && manifest.dates ? manifest.dates : [];
  const today = new Date();
  today.setHours(0,0,0,0);
  const latestDataDate = availableDates.length ? new Date(availableDates[availableDates.length - 1]) : today;
  latestDataDate.setHours(0,0,0,0);
  const end = latestDataDate > today ? latestDataDate : today;
  const earliest = availableDates.length ? new Date(availableDates[0]) : end;
  earliest.setHours(0,0,0,0);
  const daysBack = Math.max(14, Math.ceil((end - earliest) / 86400000) + 3);
  const start = new Date(end);
  start.setDate(start.getDate() - daysBack);
  const dates = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    dates.push(`${yyyy}-${mm}-${dd}`);
  }
  return dates;
}

let editorialDateDragState = null;

function startEditorialDatePan(event) {
  const scroller = event.currentTarget;
  if (!scroller) return;
  const button = event.target.closest ? event.target.closest('.ed-date-btn[data-date]') : null;
  editorialDateDragState = { x: event.clientX, left: scroller.scrollLeft, moved: false, button };
  if (scroller.setPointerCapture) scroller.setPointerCapture(event.pointerId);
}

function moveEditorialDatePan(event) {
  if (!editorialDateDragState) return;
  const scroller = event.currentTarget;
  const delta = event.clientX - editorialDateDragState.x;
  if (Math.abs(delta) > 4) editorialDateDragState.moved = true;
  scroller.scrollLeft = editorialDateDragState.left - delta;
  syncEditorialDateScrollbar();
}

function endEditorialDatePan(event) {
  const state = editorialDateDragState;
  const scroller = event.currentTarget;
  if (scroller && scroller.releasePointerCapture) {
    try { scroller.releasePointerCapture(event.pointerId); } catch (err) {}
  }
  if (state && !state.moved && state.button) {
    const date = state.button.dataset.date;
    if (date && date !== currentDate) loadDate(date, { preserveTab: true });
  }
  setTimeout(() => { editorialDateDragState = null; }, 0);
}

function handleEditorialDateClick(event, date) {
  if (editorialDateDragState && editorialDateDragState.moved) {
    event.preventDefault();
    return;
  }
  if (date && date !== currentDate) loadDate(date, { preserveTab: true });
}

function handleEditorialDateStripClick(event) {

function shiftEditorialDates(direction) {

function getEditorialSelectableDateButtons() {
  return Array.from(document.querySelectorAll('.ed-date-strip .ed-date-btn:not(.nodata)'));
}

function scrollEditorialActiveDateIntoView() {
  const scroller = document.querySelector('.ed-date-strip .ed-control-dates');
  const active = document.querySelector('.ed-date-strip .ed-date-btn.on');
  if (!scroller || !active) return;
  const maxScroll = Math.max(0, scroller.scrollWidth - scroller.clientWidth);
  const target = active.offsetLeft - Math.max(0, (scroller.clientWidth - active.offsetWidth) / 2);
  scroller.scrollLeft = Math.max(0, Math.min(maxScroll, target));
}

function getEditorialDateNearViewport() {
  const scroller = document.querySelector('.ed-date-strip .ed-control-dates');
  if (!scroller) return null;
  const viewportStart = scroller.scrollLeft;
  const viewportEnd = viewportStart + scroller.clientWidth;
  const visible = getEditorialSelectableDateButtons().filter(btn =>
    btn.offsetLeft + btn.offsetWidth >= viewportStart && btn.offsetLeft <= viewportEnd
  );
  if (visible.length) return visible[0].title;
  const target = viewportStart;
  let nearest = null;
  let nearestDistance = Infinity;
  getEditorialSelectableDateButtons().forEach(btn => {
    const center = btn.offsetLeft + btn.offsetWidth / 2;
    const distance = Math.abs(center - target);
    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearest = btn.title;
    }
  });
  return nearest;
}

function activateEditorialDateNearViewport() {
  const date = getEditorialDateNearViewport();
  if (date && date !== currentDate) loadDate(date, { preserveTab: true });
}

function syncEditorialDateScrollbar() {
  const scroller = document.querySelector('.ed-date-strip .ed-control-dates');
  const bar = document.querySelector('.ed-date-scrollbar');
  const thumb = document.querySelector('.ed-date-scroll-thumb');
  if (!scroller || !bar || !thumb) return;
  const maxScroll = scroller.scrollWidth - scroller.clientWidth;
  if (maxScroll <= 0) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  const trackWidth = bar.clientWidth;
  const thumbWidth = Math.max(80, Math.round(scroller.clientWidth / scroller.scrollWidth * trackWidth));
  const maxThumb = Math.max(1, trackWidth - thumbWidth);
  thumb.style.width = thumbWidth + 'px';
  thumb.style.transform = `translateX(${Math.round(scroller.scrollLeft / maxScroll * maxThumb)}px)`;
}

function setEditorialDateScrollFromPointer(event) {
  const scroller = document.querySelector('.ed-date-strip .ed-control-dates');
  const bar = document.querySelector('.ed-date-scrollbar');
  const thumb = document.querySelector('.ed-date-scroll-thumb');
  if (!scroller || !bar || !thumb) return;
  const rect = bar.getBoundingClientRect();
  const maxScroll = scroller.scrollWidth - scroller.clientWidth;
  const thumbWidth = thumb.offsetWidth || 80;
  const maxThumb = Math.max(1, rect.width - thumbWidth);
  const x = Math.max(0, Math.min(maxThumb, event.clientX - rect.left - thumbWidth / 2));
  scroller.scrollLeft = x / maxThumb * maxScroll;
  syncEditorialDateScrollbar();
}

function handleEditorialDateTrack(event) {
  setEditorialDateScrollFromPointer(event);
  activateEditorialDateNearViewport();
}

function startEditorialDateDrag(event) {
  event.preventDefault();
  setEditorialDateScrollFromPointer(event);
  const move = e => setEditorialDateScrollFromPointer(e);
  const stop = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', stop);
    document.removeEventListener('pointercancel', stop);
    activateEditorialDateNearViewport();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', stop);
  document.addEventListener('pointercancel', stop);
}

function handleEditorialSearchInput(value) {

function handleEditorialSearchKey(event) {

  const value = visibleInput ? visibleInput.value : (input ? input.value : '');

}

  const res = await fetch(BASE + date + '.json?v=' + Date.now());
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  reportCache.set(date, data);
  return data;
}

  const mediaUrl = item.media.url;

async function runGlobalSearch(value) {
  const rawValue = String(value || '');
  const input = document.getElementById('searchInput');
  if (input) input.value = rawValue;
  const query = rawValue.trim().toLowerCase();

  if (!query) {
    const restoreTab = tabBeforeGlobalSearch || currentTab || 'digest';
    resetGlobalSearchMode(true);
    switchTab(restoreTab);
    return;
  }

  if (!isGlobalSearchMode) tabBeforeGlobalSearch = currentTab;
  if (currentView !== 'twitter') switchView('twitter');
  isGlobalSearchMode = true;
  const token = ++globalSearchToken;
  document.body.classList.toggle('editorial-mode', currentView === 'twitter');
  document.getElementById('digestV2').style.display = '';
  document.getElementById('dailySummary').style.display = 'none';
  document.getElementById('digest').style.display = 'none';
  document.getElementById('content').innerHTML = '';
  document.getElementById('noResults').style.display = 'none';
  document.getElementById('digestV2').innerHTML = renderEditorialSearchShell(rawValue, [], true);
  setTimeout(focusEditorialSearchInput, 0);

  const terms = query.split(/\s+/).filter(Boolean);
  const dates = ((manifest && manifest.dates) || []).slice().reverse();
  const reports = await Promise.all(dates.map(date =>
    getReportByDate(date).then(data => ({ date, data })).catch(() => null)
  ));
  if (token !== globalSearchToken) return;

  const results = [];
  reports.forEach(report => {
    if (!report || !report.data || !Array.isArray(report.data.sections)) return;
    const date = report.data.date || report.date;
    report.data.sections.forEach(section => {
      (section.items || []).forEach((item, itemIndex) => {
        const haystack = getGlobalSearchText(item, section, date);
        if (terms.every(term => haystack.includes(term))) {
          results.push({ date, section, item, itemIndex });
        }
      });
    });
  });

  document.getElementById('digestV2').innerHTML = renderEditorialSearchShell(rawValue, results, false);
  setTimeout(() => {
    focusEditorialSearchInput();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 0);
}

function normalizeEditorialText(value) {
  return String(value || '')
    .replace(/\*\*/g, '')
    .replace(/#+\s*/g, '')
    .replace(/\[[^\]]+\]\(([^)]+)\)/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function normalizeDigestSummaryText(value) {
  return String(value || '')
    .replace(/\*\*([^*]+)\*\*\s*(?:\r?\n)+/g, '$1：')
    .replace(/\*\*/g, '')
    .replace(/#+\s*/g, '')
    .replace(/\[[^\]]+\]\(([^)]+)\)/g, '')
    .replace(/\r/g, '')
    .replace(/\n+/g, '；')
    .replace(/\s+/g, ' ')
    .replace(/\s*([。；;！？!?])\s*/g, '$1')
    .replace(/[；;]\s*$/, '')
    .trim();
}

function compactDigestSummaryText(value) {
  return value
    .replace(/将于明天向公众开放/g, '明日公开')
    .replace(/定位为\s*/g, '')
    .replace(/但更快、更省 token、更便宜/g, '更快更便宜')
    .replace(/游戏开发者实测称/g, '开发者实测称')
    .replace(/感觉像/g, '像')
    .replace(/说明海外对中国独立游戏的关注度在上升/g, '海外关注度上升')
    .replace(/武器载具 1:1 复刻/g, '武器载具复刻')
    .replace(/详情请点击下方【当日速览】的条目跳转到对应推文[。.]?/g, '')
    .replace(/\s*([。；;！？!?])\s*/g, '$1')
    .replace(/[；;]\s*$/, '')
    .trim();
}

function limitDisplayText(value, maxChars) {
  let text = normalizeDigestSummaryText(value);
  if (Array.from(text).length > maxChars) text = compactDigestSummaryText(text);
  const chars = Array.from(text);
  if (chars.length <= maxChars) return text;
  const units = text.match(/[^。；;！？!?]+[。；;！？!?]?/g) || [];
  let summary = '';
  for (const unit of units) {
    const next = (summary + unit).trim();
    if (Array.from(next).length > maxChars) break;
    summary = next;
  }
  if (summary) {
    const completeSummary = summary.replace(/[；;]+$/, '').trim();
    return /[。！？!?]$/.test(completeSummary) ? completeSummary : completeSummary + '。';
  }
  const firstUnit = (units[0] || text).trim();
  if (!firstUnit) return '';
  const completeFirstUnit = firstUnit.replace(/[；;]+$/, '').trim();
  return /[。！？!?]$/.test(completeFirstUnit) ? completeFirstUnit : completeFirstUnit + '。';
}

const DIGEST_SUMMARY_MAX_CHARS = 220;

function formatEditorialHeroTitle(value) {
  const text = normalizeEditorialText(value);
  const chars = Array.from(text);
  const maxChars = 36;
  if (chars.length <= maxChars) return text;

  const cutChars = new Set(['，', ',', '；', ';', '。']);
  const candidates = [];
  chars.forEach((ch, index) => {
    if (cutChars.has(ch) && index >= 17 && index <= maxChars) {
      candidates.push(chars.slice(0, index).join('').trim());
    }
  });
  if (candidates.length) return candidates[candidates.length - 1];

  const colonIndex = chars.findIndex(ch => ch === '：' || ch === ':');
  if (colonIndex >= 16 && colonIndex <= maxChars) {
    return chars.slice(0, colonIndex).join('').trim();
  }

  return text;
}

function getEditorialDigestSummary() {
  const raw = currentData.daily_summary || currentData.lede || '';
  return limitDisplayText(raw, DIGEST_SUMMARY_MAX_CHARS);
}

    return host + url.pathname.replace(/\/$/, '');
  } catch (error) {
    return String(value || '').trim().replace(/[?#].*$/, '').replace(/\/$/, '');
  }
}

async function findTwitterWeeklyStoryTarget(link, shortDate) {
  const dates = ((manifest && manifest.dates) || []).slice();
  const dateMatch = String(shortDate || '').match(/^(\d{1,2})\.(\d{1,2})$/);
  const dateSuffix = dateMatch
    ? '-' + dateMatch[1].padStart(2, '0') + '-' + dateMatch[2].padStart(2, '0')
    : '';
  const likelyDates = dateSuffix ? dates.filter(date => date.endsWith(dateSuffix)) : [];
  const orderedDates = likelyDates.concat(dates.filter(date => !likelyDates.includes(date)));
  const normalizedLink = normalizeTweetLink(link);

  for (const date of orderedDates) {
    try {
      const report = await getReportByDate(date);
      for (const section of (report.sections || [])) {
        const itemIndex = (section.items || []).findIndex(item => normalizeTweetLink(item.link) === normalizedLink);
        if (itemIndex >= 0) return { date, sectionId: section.id, itemIndex };
      }
    } catch (error) {}
  }
  return null;
}

async function openTwitterWeeklyStoryAnalysis(card) {
  if (!card || !card.dataset || card.classList.contains('is-loading')) return;
  twitterWeeklyReturnScrollY = window.scrollY;
  twitterWeeklyReturnIndex = activeTwitterWeeklyIndex;
  twitterWeeklyReturnPending = true;
  card.classList.add('is-loading');
  card.setAttribute('aria-busy', 'true');
  try {
    const target = await findTwitterWeeklyStoryTarget(card.dataset.link, card.dataset.date);
    if (!target) throw new Error('Missing matching daily analysis item');
    const targetTab = target.sectionId === 'tools' ? 'ai' : target.sectionId;
    await loadDate(target.date, { tab: targetTab });
    setTimeout(() => {
      const analysisCard = document.getElementById(`card-${target.sectionId}-${target.itemIndex}`);
      if (analysisCard) analysisCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  } catch (error) {
    console.warn('Twitter weekly story navigation failed:', error);
    twitterWeeklyReturnPending = false;
    card.classList.remove('is-loading');
    card.removeAttribute('aria-busy');
  }
}

function renderHeroPicks() {
  // Zone B: Hero Cards
  let picks = [];

  if (currentData.editors_pick && currentData.editors_pick.length) {
    // Use explicit editors_pick
    currentData.editors_pick.forEach(pick => {
      const section = currentData.sections.find(s => s.id === pick.section_id);
      if (!section || !section.items[pick.item_index]) return;
      const item = section.items[pick.item_index];
      picks.push({ item, section, hook: pick.hook || item.recommendation || item.title });
    });
  } else {
    // Fallback: rank all items by engagement, pick top 2 with media (prefer different sections)
    const candidates = [];
    currentData.sections.forEach(section => {
      section.items.forEach(item => {
        if (!item.media) return;
        const score = (item.views || 0) + (item.likes || 0) * 100;
        candidates.push({ item, section, score, hook: item.recommendation || item.title });
      });
    });
    candidates.sort((a, b) => b.score - a.score);
    const usedSections = new Set();
    for (const c of candidates) {
      if (picks.length >= 2) break;
      // Prefer diversity: skip same section if we have other options
      if (usedSections.has(c.section.id) && picks.length < 2 && candidates.filter(x => !usedSections.has(x.section.id)).length > 0) continue;
      picks.push(c);
      usedSections.add(c.section.id);
    }
    // If diversity filter was too strict, just take top 2
    if (picks.length < 2) {
      picks = candidates.slice(0, 2);
    }
  }

  if (picks.length === 0) return '';

  const gridClass = picks.length === 1 ? 'hero-section single' :
                    picks.length === 3 ? 'hero-section triple' : 'hero-section';

  let html = `<div class="${gridClass}">`;
  picks.forEach(({ item, section, hook }) => {
    const coverUrl = (item.media && item.media.url) || (item.enrichment && item.enrichment.header_image) || '';
    const isVideo = item.media && item.media.type === 'video';
    const avatarUrl = item.media && item.media.url && item.media.url.includes('twimg.com') ? '' : '';
    const summaryTrunc = (item.summary || '').substring(0, 80) + (item.summary && item.summary.length > 80 ? '...' : '');
    const likesStr = (item.likes || 0) >= 1000 ? ((item.likes / 1000).toFixed(1) + 'K') : (item.likes || 0);
    const viewsStr = (item.views || 0) >= 1000 ? ((item.views / 1000).toFixed(0) + 'K') : (item.views || 0);
    const sectionIdx = currentData.sections.indexOf(section);
    const itemIdx = section.items.indexOf(item);

    html += `<div class="hero-card" onclick="jumpToCard('${section.id}', ${itemIdx})">
      <div class="hero-cover">
        ${coverUrl ? `<img src="${coverUrl}" alt="" referrerpolicy="no-referrer">` : ''}
        <div class="hero-cover-gradient"></div>
        <span class="hero-cover-badge" style="background:${section.color}">${section.title}</span>
        ${isVideo ? '<span class="hero-cover-play">&#9654;</span>' : ''}
      </div>
      <div class="hero-body">
        <div class="hero-hook">${hook}</div>
        <div class="hero-summary">${summaryTrunc}</div>
        <div class="hero-meta">
          <span class="hero-meta-left">@${item.author} · ♥${likesStr} · 👁${viewsStr}</span>
          <a class="hero-meta-link" href="${item.link}" target="_blank" onclick="event.stopPropagation()">查看原文 →</a>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function switchTab(tab, scrollToId) {
  const activeDate = (currentData && currentData.date) || currentDate || '';
  const shouldRestoreDigest = tab === 'digest'
    && editorialDigestReturnPending
    && editorialDigestReturnDate === activeDate;
  const digestReturnScrollY = editorialDigestReturnScrollY;
  if (currentView !== 'twitter') switchView('twitter');
  resetGlobalSearchMode(true);
  currentTab = tab;
  document.body.classList.toggle('editorial-mode', currentView === 'twitter');
  renderTabs();
  document.getElementById('digestV2').style.display = '';
  document.getElementById('dailySummary').style.display = 'none';
  document.getElementById('digest').style.display = 'none';
  document.getElementById('content').innerHTML = '';
  if (tab === 'digest') {
    renderDigestV2();
    if (!scrollToId) {
      setTimeout(() => {
        window.scrollTo({
          top: shouldRestoreDigest ? digestReturnScrollY : 0,
          behavior: shouldRestoreDigest ? 'auto' : 'smooth'
        });
        editorialDigestReturnPending = false;
      }, 50);
    }
  } else if (tab === 'weekly') {
    document.getElementById('digestV2').innerHTML = renderEditorialWeeklyShell();
    renderTwitterWeekly();
    setTimeout(() => {
      scrollEditorialActiveNavIntoView();
    }, 50);
  } else {
    document.getElementById('digestV2').innerHTML = renderEditorialContentShell();
    renderContent('edLegacyContent');
    setTimeout(() => {
      if (scrollToId) {
        const el = document.getElementById(scrollToId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      scrollEditorialActiveNavIntoView();
      syncEditorialDateScrollbar();
    }, 50);
  }
}

function jumpToCard(sectionId, itemIndex) {
  const cardId = `card-${sectionId}-${itemIndex}`;
  switchTab(sectionId === 'tools' ? 'ai' : sectionId, cardId);
}

function handleEditorialPickClick(event, card) {
  if (!event || !card || event.defaultPrevented) return;
  const target = event.target;
  const interactive = target && target.closest
    ? target.closest('a,button,input,textarea,select')
    : null;
  if (interactive && card.contains(interactive)) return;
  const selection = window.getSelection ? String(window.getSelection()).trim() : '';
  if (selection) return;
  openEditorialAnalysisCard(card);
}

function handleEditorialPickKey(event, card) {
  if (!event || event.key !== 'Enter' || event.target !== card) return;
  event.preventDefault();
  openEditorialAnalysisCard(card);
}

function openEditorialAnalysisCard(card) {
  if (!card || !card.dataset) return;
  const sectionId = card.dataset.section || '';
  const itemIndex = Number(card.dataset.itemIndex);
  if (!sectionId || !Number.isInteger(itemIndex)) return;
  editorialDigestReturnScrollY = window.scrollY;
  editorialDigestReturnDate = (currentData && currentData.date) || currentDate || '';
  editorialDigestReturnPending = true;
  jumpToCard(sectionId, itemIndex);
}

function renderGameIntro(item) {
  const e = item && item.enrichment;
  if (!e || !e.why_notable) return '';
  const reason = e.why_notable
    ? `<div class="enrich-highlight">\u5173\u6ce8\u7406\u7531\uff1a${escapeHtml(String(e.why_notable).trim())}</div>`
    : '';
  return `<div class="field game-intro-field"><span class="lab game-intro">\u6e38\u620f\u7b80\u4ecb</span>${reason}</div>`;
}

function getEnrichmentMetaLine(description, label) {
  const pattern = new RegExp('(?:^|\\n)' + label + '[：:]\\s*([^\\n]+)');
  const match = String(description || '').match(pattern);
  return match ? match[1].trim() : '';
}

function getEnrichmentPositioning(e) {
  const description = String((e && e.description) || '').trim();
  if (!description) return (e && e.positioning) || '';
  return description
    .split(/\n+/)
    .map(line => line.trim())
    .filter(line => line && !/^(Steam 状态|开发商|信源)[：:]/.test(line))
    .join('\n');
}

function renderEnrichmentInfoItem(label, value, className = '') {
  const text = String(value || '').trim();
  if (!text) return '';
  const valueClass = className ? ' enrich-info-value ' + className : ' enrich-info-value';
  return `<div class="enrich-info-item"><span class="enrich-info-label">${escapeHtml(label)}</span><span class="${valueClass.trim()}">${escapeHtml(text)}</span></div>`;
}

function getEnrichmentStats(e) {
  const stats = (e && e.stats) || {};
  return {
    sales: stats.sales || (e && e.estimated_sales) || '',
    revenue: stats.revenue || (e && e.estimated_revenue) || '',
    pcuPeak: stats.pcu_peak || (e && e.pcu) || '',
    pcuCurrent: stats.pcu_current || (e && e.current_players) || '',
    review: stats.review || (e && e.steam_review) || '',
    followers: stats.followers || (e && e.steam_followers) || ''
  };
}

function hasKnownReleaseTime(value) {
  return /20\d{2}|Q[1-4]|季度|\d{1,2}\s*月|\d{1,2}\s*[\/.-]\s*\d{1,2}/i.test(String(value || ''));
}

function getTestingStatus(e) {
  const values = [e && e.release_date, e && e.steam_status, getEnrichmentMetaLine(e && e.description, 'Steam 状态'), e && e.description]
    .map(value => String(value || '').trim())
    .filter(Boolean);
  const explicit = values.find(value => /封测中|测试中|CBT|Beta|Tech Test|Demo 已上线|试玩/.test(value));
  if (!explicit) return '';
  const dateMatch = String((e && e.description) || '').match(/((?:20\d{2}\s*[年.-]\s*)?\d{1,2}\s*(?:[\/.月-])\s*\d{1,2}\s*日?|Q[1-4]\s*20\d{2}|20\d{2}\s*Q[1-4])\s*(?:开始)?\s*(?:测试|封测|CBT|Beta)/i);
  if (dateMatch) return `${dateMatch[1].replace(/\s+/g, '')} 测试`;
  if (/Tech Test\s*进行中/i.test(explicit)) return 'Tech Test 进行中';
  if (/CBT|封测/i.test(explicit)) return '封测中';
  if (/Beta|测试/i.test(explicit)) return '测试中';
  if (/Demo 已上线|试玩/.test(explicit)) return 'Demo 已上线，正式发售时间待定';
  return explicit;
}

function getReleaseStatus(e) {
  const rawRelease = String((e && e.release_date) || '').trim();
  const steamStatus = String((e && e.steam_status) || getEnrichmentMetaLine(e && e.description, 'Steam 状态') || '').trim();
  const description = String((e && e.description) || '').trim();
  const releaseSource = rawRelease || steamStatus;
  if (/已发售|正式上线|已上线/.test(releaseSource + description)) return rawRelease || '已上线';
  if (hasKnownReleaseTime(releaseSource)) return `预计 ${releaseSource} 发售`;
  const descRelease = description.match(/(?:预计|将于|确认)?\s*((?:20\d{2}\s*年\s*)?(?:Q[1-4]|第[一二三四1-4]季度|\d{1,2}\s*[\/.]\s*\d{1,2}|\d{1,2}\s*月\s*\d{0,2}\s*日?))\s*(?:发售|发布|推出|上线)/);
  if (descRelease) return `预计 ${descRelease[1].replace(/\s+/g, '')} 发售`;
  if (/即将发售|即将推出|Coming Soon|未上架|未发售|开发中|未定|未知|未公布|TBA|待定/i.test(releaseSource + steamStatus)) return '未上线，发售时间待定';
  return releaseSource || '未上线，发售时间待定';
}

function formatMarketReleaseDate(e) {
  const values = [e && e.release_date, getEnrichmentMetaLine(e && e.description, '上线时间'), getEnrichmentMetaLine(e && e.description, '发售时间')]
    .map(value => String(value || '').trim())
    .filter(Boolean);
  for (const value of values) {
    const ymd = value.match(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})\s*日?/);
    if (ymd) return `${ymd[1]}年${ymd[2].padStart(2, '0')}月${ymd[3].padStart(2, '0')}日上线`;
    const english = value.match(/(\d{1,2})\s+([A-Za-z]{3,9}),?\s*(20\d{2})/);
    if (english) {
      const months = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', sept: '09', oct: '10', nov: '11', dec: '12' };
      const month = months[english[2].slice(0, 3).toLowerCase()];
      if (month) return `${english[3]}年${month}月${english[1].padStart(2, '0')}日上线`;
    }
  }
  return '已上线';
}

function formatEnrichmentStatus(e) {
  if (!e) return '';
  return getTestingStatus(e) || getReleaseStatus(e);
}

function renderEnrichmentIntro(e, item, sectionId) {
  if (!e) return '';
  const isMarketGame = sectionId === 'industry';
  const stats = getEnrichmentStats(e);
  const statusText = isMarketGame ? formatMarketReleaseDate(e) : formatEnrichmentStatus(e);
  const positioning = getEnrichmentPositioning(e) || e.positioning || '';
  const developer = e.developer || getEnrichmentMetaLine(e.description, '开发商') || '';
  const source = e.source || getEnrichmentMetaLine(e.description, '信源') || (item && item.source) || '';
  const rows = [
    renderEnrichmentInfoItem('游戏状态', statusText, 'is-status'),
    isMarketGame ? renderEnrichmentInfoItem('预估销量', stats.sales || '待抓取', 'is-metric') : '',
    isMarketGame ? renderEnrichmentInfoItem('PCU', stats.pcuPeak || '待抓取', 'is-metric') : '',
    renderEnrichmentInfoItem('一句话定位', positioning, 'is-positioning'),
    renderEnrichmentInfoItem('开发商信息', developer),
    renderEnrichmentInfoItem('信源', source)
  ].join('');
  if (!rows) return '';
  return `<div class="enrich-intro-card"><div class="enrich-info-list">${rows}</div></div>`;
}

function renderEnrichment(item, sectionId = '') {
  if (!item.enrichment) return '';
  const e = item.enrichment;
  let html = '<div class="enrichment"><div class="enrich-grid">';

  // Zone 1: Left - Media (video/image from tweet or Steam header)
  html += '<div class="enrich-media">';
  const mediaUrl = e.header_image || (item.media && item.media.url) || '';
  const videoUrl = item.media && item.media.video_url;
  if (videoUrl && mediaUrl) {
    html += `<a href="${item.link}" target="_blank" rel="noopener" aria-label="查看原推文"><img src="${mediaUrl}" alt="" referrerpolicy="no-referrer"><div class="play-overlay"><span>&#9654;</span></div></a>`;
  } else if (mediaUrl) {
    html += `<a href="${item.link}" target="_blank" rel="noopener" aria-label="查看原推文"><img src="${mediaUrl}" alt="" referrerpolicy="no-referrer"></a>`;
  }
  html += '</div>';

  // Zone 2: Right top - Game intro OR data stats/release info
  const introHtml = renderEnrichmentIntro(e, item, sectionId);
  html += '<div class="enrich-data' + (introHtml ? ' has-intro' : '') + '">';
  if (introHtml) {
    html += introHtml;
  } else if (getEnrichmentStats(e).pcuPeak) {
    const stats = getEnrichmentStats(e);
    html += `<div class="enrich-stat"><span class="enrich-stat-label">PCU</span><span class="enrich-stat-value gold">${stats.pcuPeak}</span>`;
    if (e.pcu_rank) html += `<span class="enrich-stat-sub">Top ${e.pcu_rank}</span>`;
    html += `</div>`;
  }
  if (!introHtml && e.steam_rating && !e.steam_rating.includes('未发售')) {
    html += `<div class="enrich-stat"><span class="enrich-stat-label">好评率</span><span class="enrich-stat-value">${e.steam_rating}</span></div>`;
  }
  if (!introHtml && getEnrichmentStats(e).sales && getEnrichmentStats(e).sales !== '暂无官方数据') {
    html += `<div class="enrich-stat"><span class="enrich-stat-label">销量 / 销售额</span><span class="enrich-stat-value">${getEnrichmentStats(e).sales}</span></div>`;
  }
  const hasLiveData = getEnrichmentStats(e).pcuPeak || (e.steam_rating && !e.steam_rating.includes('未发售')) || (getEnrichmentStats(e).sales && getEnrichmentStats(e).sales !== '暂无官方数据');
  if (!introHtml && !hasLiveData) {
    // Unreleased game: show release info instead
    if (e.release_date) {
      html += `<div class="enrich-stat"><span class="enrich-stat-label">预计发售</span><span class="enrich-stat-value">${e.release_date}</span></div>`;
    }
    if (e.price && e.price !== '未公布') {
      html += `<div class="enrich-stat"><span class="enrich-stat-label">价格</span><span class="enrich-stat-value">${e.price}</span></div>`;
    }
    if (e.positioning) {
      html += `<div class="enrich-stat"><span class="enrich-stat-label">一句话定位</span><span class="enrich-stat-value" style="font-size:14px;font-weight:600;line-height:1.5">${e.positioning}</span></div>`;
    }
    if (!e.release_date && !e.positioning) {
      html += `<div class="enrich-nodata"><span>暂未发售</span></div>`;
    }
  }
  html += '</div>';

  // Zone 3: Right bottom - Tags + Steam link
  html += '<div class="enrich-tags-zone">';
  if (e.genre) e.genre.split('/').forEach(t => { html += `<span class="enrich-tag">${t.trim()}</span>`; });
  if (e.platforms) e.platforms.forEach(p => { html += `<span class="enrich-tag platform">${p}</span>`; });
  if (e.steam_url) html += `<a class="enrich-tag steam-link" href="${e.steam_url}" target="_blank">Steam 页面</a>`;
  html += '</div>';


  html += '</div></div>';
  return html;
}

function getFilteredGames() {
  const q = libState.q.trim().toLowerCase();
  let list = (gamesLibrary.games || []).filter(g => (g.pcu_peak || 0) >= 1000);
  if (libState.filter === 'indie') list = list.filter(g => g.grade === 'Indie');
  else if (libState.filter === 'aa') list = list.filter(g => g.grade === 'AA');
  else if (libState.filter === 'award') list = list.filter(g => g.award);
  if (q) {
    list = list.filter(g => [g.name, g.name_cn, g.award, (g.developer || []).join(' '), (g.publisher || []).join(' ')]
      .filter(Boolean).join(' ').toLowerCase().includes(q));
  }
  list.sort(LIB_SORTS[libState.sort] || LIB_SORTS.rating);
  return list;
}

function libSetFilter(filter) {
  libState.filter = filter;
  document.querySelectorAll('#libraryContent .lib-pill').forEach(btn => {
    btn.classList.toggle('on', btn.dataset.filter === filter);

function libSetSort(sort) {

function libSetView(view) {

}

function libCoverFallback(img) {
  const holder = img.parentElement;
  if (img.dataset.step === '0' && img.dataset.appid) {
    img.dataset.step = '1';
    img.src = `https://cdn.cloudflare.steamstatic.com/steam/apps/${img.dataset.appid}/capsule_616x353.jpg`;
    return;
  }
  if (holder) holder.classList.add('no-img');
  img.remove();
}

function formatCnDate(iso) {
  if (!iso) return '';
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return iso;
  return `${y}年${m}月${d}日`;
}

function shortAward(str) {
  const ORGS = ['TGA', 'BAFTA', 'IGF', 'GDCA', 'DICE', 'GJA', 'SXSW', 'Webby'];
  const segs = String(str).split(';').map(s => s.trim()).filter(Boolean);
  const chips = [];
  for (const seg of segs) {
    const org = ORGS.find(o => seg.toUpperCase().includes(o));
    if (!org) continue;
    const ym = seg.match(/20\d{2}/);
    chips.push(ym ? `${ym[0]}年${org}` : org);
    if (chips.length >= 2) break;
  }
  return chips.length ? chips.join(' · ') : '官方获奖';
}

// === 上线游戏日推 (Launched Games Daily) ===
const LAUNCHED_BASE = 'data/launched/';
let launchedManifest = null;
let launchedData = null;
let launchedDate = null;

async function renderLaunched() {
  document.getElementById('launchedEditorialNav').innerHTML = `<nav class="ed-top-nav" aria-label="日报与上线日推导航">${renderEditorialTopNav()}</nav>`;

async function loadLaunchedDate(date) {
  const host = document.getElementById('launchedContent');
  launchedDate = date;
  try {
    const res = await fetch(`${LAUNCHED_BASE}${date}.json?v=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    launchedData = await res.json();
    renderLaunchedContent();
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 30);
  } catch (e) {
    host.innerHTML = `<div class="roblox-error">该日期暂无数据<br><small>${escapeHtml(e.message)}</small></div>`;
  }
}

    <div class="ld-lede">

  const html = `<div class="ld-modal-mask" onclick="if(event.target===this)ldCloseGameModal()">

      <div class="ld-modal-body">

        ${(d.tags && d.tags.length) ? `<div class="ld-modal-tags">${d.tags.slice(0, 3).map(t => `<span class="lib-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="ld-modal-grid">
          ${cell('上线时间', formatCnDate(d.release) || '—')}
          ${cell('好评率', d.rating != null ? d.rating + '%' : '—')}
          ${cell('PCU 峰值', d.pcu ? formatCount(d.pcu) : '—')}
          ${cell('预估销量', d.sales ? formatCount(d.sales) : '—')}
          ${cell('开发商', escapeHtml((d.dev || []).join(' / ') || '—'))}

        </div>

function renderLaunchedBoard(board, bi) {
  const badge = board.demo
    ? '<span class="ld-demo">示例数据 · 待接入</span>'
    : `<span class="ld-real">${board.id === 'roblox' ? '每周更新' : '每日更新'}</span>`;
  const CAPTIONS = {
    steamdb: '按近期 Steam 关注增长排序 · 数值为新增关注数',
    bilibili: '机会分排序(新游/异动优先) · 数值为关联视频在日榜的最高名次',
    twitter: '按关联推文浏览量排序 · 数值为推文浏览量',
    roblox: '按周同时在线峰值排序 · 数值为 CCU(最高同时在线人数)'
  };
  const cap = board.caption || CAPTIONS[board.id] || '';
  const head = `<div class="tw-week-section-kicker">${escapeHtml(board.title_en || '')}${board.week ? ' · ' + escapeHtml(board.week) : ''}</div><h2>${escapeHtml(board.title)}${badge}</h2>${cap ? `<div class="ld-board-cap">${escapeHtml(cap)}</div>` : ''}`;
  const all = board.items || [];
  const pages = Math.ceil(all.length / 10);
  const paged = pages > 1;
  ldBoardPages[bi] = 0;
  const body = `<div class="ld-col-rank" id="ld-list-${bi}">${all.slice(0, 10).map((it, i) => ldRankItemHtml(bi, it, i)).join('')}</div>`;
  const pager = paged
    ? `<div class="ld-pager"><button type="button" class="roblox-week-btn" id="ld-prev-${bi}" onclick="ldSetPage(${bi},-1)" disabled>‹ 上一页</button><span class="ld-page-info" id="ld-page-${bi}">1 / ${pages}</span><button type="button" class="roblox-week-btn" id="ld-next-${bi}" onclick="ldSetPage(${bi},1)">下一页 ›</button></div>`
    : '';
  let moreLink = '';
  if (board.more) {
    if (board.more.href) moreLink = `<a class="roblox-week-btn ld-more-link" href="${escapeHtml(board.more.href)}" target="_blank" rel="noopener">${escapeHtml(board.more.label)} →</a>`;
    else if (board.more.tab) moreLink = `<button type="button" class="roblox-week-btn" onclick="ldGotoDailyTab('${escapeHtml(board.more.tab)}')">${escapeHtml(board.more.label)} →</button>`;
    else moreLink = `<button type="button" class="roblox-week-btn" onclick="switchView('${escapeHtml(board.more.view)}')">${escapeHtml(board.more.label)} →</button>`;
  }
  const more = (pager || moreLink) ? `<div class="ld-board-more">${pager}${moreLink}</div>` : '';
  return `<div class="tw-week-block ld-board">${head}${body}${more}</div>`;
}

const ldBoardPages = {};
function ldIsFresh7(rel) {
  if (!rel || rel === '9999-12-31') return false;
  const t = Date.parse(rel);
  if (Number.isNaN(t)) return false;
  return (Date.now() - t) <= 7 * 86400000;
}

function ldRankItemHtml(bi, it, i) {
  const name = `<span class="ld-col-rank-name ${it.mature ? 'ld-name-mature' : ''}" title="${escapeHtml(it.sub || '')}">${escapeHtml(it.name)}</span>`;
  const stamp = (it.fresh || ldIsFresh7(it.release)) ? '<span class="ld-stamp">新</span>' : '';
  const thumb = it.thumb
    ? `<span class="ld-thumb-wrap">${stamp}<img class="ld-col-rank-thumb" src="${escapeHtml(it.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>`
    : stamp;
  const metricCls = (it.metric || '').length > 10 ? 'ld-col-rank-metric ld-metric-long' : 'ld-col-rank-metric';
  const inner = `<span class="ld-col-rank-num">${i + 1}</span>${thumb}${name}<span class="${metricCls}">${escapeHtml(it.metric || '')}</span>`;
  return `<span class="ld-col-rank-item" onclick="ldOpenGameModal(${bi}, ${i})">${inner}</span>`;
}

function ldSetPage(bi, dir) {
  const all = launchedData.boards[bi].items || [];
  const pages = Math.ceil(all.length / 10);
  const next = Math.max(0, Math.min(pages - 1, (ldBoardPages[bi] || 0) + dir));
  ldBoardPages[bi] = next;
  const list = document.getElementById(`ld-list-${bi}`);
  if (list) list.innerHTML = all.slice(next * 10, next * 10 + 10).map((it, i) => ldRankItemHtml(bi, it, next * 10 + i)).join('');
  const info = document.getElementById(`ld-page-${bi}`);
  if (info) info.textContent = `${next + 1} / ${pages}`;
  const prev = document.getElementById(`ld-prev-${bi}`);
  const nextBtn = document.getElementById(`ld-next-${bi}`);
  if (prev) prev.disabled = next === 0;
  if (nextBtn) nextBtn.disabled = next === pages - 1;
}

// === 游戏详情弹窗 ===
let gameDetails = null;
async function ensureGameDetails() {
  if (gameDetails) return;
  const res = await fetch(BASE + 'game-details.json?v=' + Date.now());
  gameDetails = res.ok ? await res.json() : { byName: {}, byAppid: {} };
}
const normGameName = s => String(s || '').toLowerCase().replace(/[^\w\u4e00-\u9fa5]/g, '');
function findGameDetail(it) {
  const m = String(it.link || '').match(/store\.steampowered\.com\/app\/(\d+)/);
  if (m && gameDetails.byAppid[m[1]]) return gameDetails.byAppid[m[1]];
  const key = normGameName(it.name);
  if (gameDetails.byName[key]) return gameDetails.byName[key];
  const all = Object.values(gameDetails.byAppid);
  return all.find(d => d.name_cn && normGameName(d.name_cn) === key)
    || all.find(d => d.name_cn && (normGameName(d.name_cn).includes(key) || key.includes(normGameName(d.name_cn))))
    || null;
}
async function ldOpenGameModal(bi, ii) {
  const board = launchedData.boards[bi];
  const it = board.items[ii];
  if (board.id === 'roblox') return ldOpenRobloxModal(it);
  await ensureGameDetails();
  const d = findGameDetail(it) || { name: it.name };
  if (!d.release && it.release) d.release = it.release;
  const cell = (k, v) => `<div class="ld-modal-item"><span class="k">${k}</span><span class="v">${v || '—'}</span></div>`;
  const tags = (d.tags && d.tags.length) ? d.tags.slice(0, 3) : [];
  const platform = d.appid ? 'Steam' : (d.platform || '—');
  const ratingCell = cell('好评率', d.rating != null ? d.rating + '%' : '—');
  // 手游判定: 非Steam 且 平台含移动端(原神/终末地等多端手游也走此版式)
  const isMobileGame = !d.appid && /iOS|Android|移动/.test(d.platform || '');
  let infoHtml;
  if (isMobileGame) {
    // 手游卡片: 平台/上线时间/畅销榜排名 · 开发商/发行商(发行商对齐上线时间列)
    infoHtml = `<div class="ld-modal-grid ld-grid-3">${
      cell('平台', escapeHtml(platform))
      + cell('上线时间', formatCnDate(d.release) || '—')
      + cell('iOS 畅销榜', d.mobile_rank ? '#' + d.mobile_rank : '—')
      + cell('开发商', escapeHtml((d.dev || []).join(' / ') || '—'))
      + cell('发行商', escapeHtml((d.pub || []).join(' / ') || '—'))
    }</div>`;
  } else if (board.id === 'steamdb') {
    // 上线时间/好评率 · PCU/销量 · 开发商/发行商
    infoHtml = `<div class="ld-modal-grid">${
      cell('上线时间', formatCnDate(d.release) || '—')
      + ratingCell
      + cell('PCU 峰值', d.pcu ? formatCount(d.pcu) : '—')
      + cell('预估销量', d.sales ? formatCount(d.sales) : '—')
      + cell('开发商', escapeHtml((d.dev || []).join(' / ') || '—'))
      + cell('发行商', escapeHtml((d.pub || []).join(' / ') || '—'))
    }</div>`;
  } else {
    // 平台/上线时间/好评率 · PCU/销量 · 开发商/发行商 (销量与发行商纵向对齐上线时间列)
    infoHtml = `<div class="ld-modal-grid ld-grid-3">${
      cell('平台', escapeHtml(platform))
      + cell('上线时间', formatCnDate(d.release) || '—')
      + ratingCell
      + cell('PCU 峰值', d.pcu ? formatCount(d.pcu) : '—')
      + cell('预估销量', d.sales ? formatCount(d.sales) : '—')
      + '<div></div>'
      + cell('开发商', escapeHtml((d.dev || []).join(' / ') || '—'))
      + cell('发行商', escapeHtml((d.pub || []).join(' / ') || '—'))
    }</div>`;
  }
  const nameLine = escapeHtml(d.name || it.name) + (d.name_cn && d.name_cn !== d.name ? ` <span class="ld-modal-cn-inline">${escapeHtml(d.name_cn)}</span>` : '');
  const html = `<div class="ld-modal-mask" onclick="if(event.target===this)ldCloseGameModal()">
    <div class="ld-modal" role="dialog" aria-label="游戏详情">
      <button type="button" class="ld-modal-close" onclick="ldCloseGameModal()" aria-label="关闭">✕</button>
      ${(d.cover || it.thumb) ? `<img class="ld-modal-cover" src="${escapeHtml(d.cover || it.thumb)}" alt="" referrerpolicy="no-referrer">` : ''}
      <div class="ld-modal-body">
        <div class="ld-modal-name">${nameLine}</div>
        ${d.desc ? `<div class="ld-modal-desc">${escapeHtml(d.desc)}</div>` : ''}
        ${tags.length ? `<div class="ld-modal-tags">${tags.map(t => `<span class="lib-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        ${infoHtml}
        ${board.id === 'twitter' && it.day != null
          ? `<button type="button" class="ld-modal-steam ld-modal-btn" onclick="ldGotoTweet('${it.day}', ${it.idx != null ? it.idx : -1})">查看推文分析 →</button>`
          : board.id === 'bilibili'
            ? `${d.steam ? `<a class="ld-modal-steam" href="${escapeHtml(d.steam)}" target="_blank" rel="noopener">前往游戏商店页 →</a>` : ''}${it.link ? `<a class="ld-modal-steam ld-modal-btn-video" href="${escapeHtml(it.link)}" target="_blank" rel="noopener">查看原视频 →</a>` : ''}`
            : (d.steam ? `<a class="ld-modal-steam" href="${escapeHtml(d.steam)}" target="_blank" rel="noopener">前往 Steam 商店页 →</a>` : '')}
      </div>
    </div>
  </div>`;
  ldCloseGameModal();
  document.body.insertAdjacentHTML('beforeend', html);
  document.body.style.overflow = 'hidden';
}
function ldCloseGameModal() {
  const v = document.getElementById('ldPickVideo');
  if (v && v._hls) v._hls.destroy();
  const m = document.querySelector('.ld-modal-mask');
  if (m) m.remove();
  document.body.style.overflow = '';
}

async function ldGotoTweet(date, idx) {
  ldCloseGameModal();
  if (date && date !== currentDate) await loadDate(date);
  if (idx != null && idx >= 0) jumpToCard('indie', idx);
  else switchTab('indie');
}

// 跳转到最新一天的日报页签
async function ldGotoDailyTab(tab) {
  const dates = (manifest && manifest.dates) || [];
  const latest = dates[dates.length - 1];
  if (latest && latest !== currentDate) await loadDate(latest);
  switchTab(tab);
}

function renderLaunchedWatch(watch) {
  if (!watch || !watch.featured) return '';
  const feat = watch.featured;
  return `<div class="ld-watch-wrap"><section class="tw-week-watch">
    <div class="tw-week-section-kicker">UNRELEASED WATCH · 新游雷达</div>
    <div class="tw-week-watch-head"><h2>未上线游戏观测</h2></div>
    <div class="ld-cal-head"><span class="ld-cal-month">值得关注的游戏</span></div>
    <div class="ld-watch-feat">${feat.map(w => `
      <a class="ld-watch-card" href="${escapeHtml(w.link || '#')}" target="_blank" rel="noopener">
        ${w.cover ? `<img src="${escapeHtml(w.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}
        <span class="ld-watch-card-body">
          <span class="ld-watch-card-name">${escapeHtml(w.name)}</span>
          <span class="ld-watch-card-date">${escapeHtml(w.date || '')}</span>
          <span class="ld-watch-card-note">${escapeHtml(w.note || '')}</span>

    ${renderWatchCalendar(watch.calendar || [])}
    ${watch.more ? `<div class="ld-board-more" style="border-top-color:rgba(255,250,244,.18)"><a class="roblox-week-btn ld-more-link" href="${escapeHtml(watch.more.href)}" target="_blank" rel="noopener">${escapeHtml(watch.more.label)} →</a></div>` : ''}
  </section></div>`;
}

function renderWatchCalendar(events) {
  if (!events.length) return '';
  const ref = launchedData && launchedData.date ? new Date(launchedData.date) : new Date();
  const y = ref.getFullYear();
  const m = ref.getMonth();
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const firstOffset = (new Date(y, m, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const byDay = {};
  events.forEach(e => {
    const d = Number(String(e.date).slice(8, 10));
    (byDay[d] = byDay[d] || []).push(e);
  });
  const dows = ['一', '二', '三', '四', '五', '六', '日'];
  let cells = '';
  for (let i = 0; i < firstOffset; i++) cells += '<div class="ld-cal-cell" style="visibility:hidden;pointer-events:none"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const evs = byDay[d] || [];
    cells += `<div class="ld-cal-cell ${evs.length ? 'has-ev' : ''} ${ds === todayStr ? 'today' : ''} ${ds < todayStr ? 'dim' : ''}" data-day="${ds}" onclick="ldCalSelect('${ds}')">
      <span class="ld-cal-day">${d}</span>
      ${evs.length ? `<span class="ld-cal-badge">${evs.length}款新游</span>` : ''}
      ${evs.map(e => `<span class="ld-cal-chip">${escapeHtml(e.name)}<small>${escapeHtml(e.type)} · ${escapeHtml(e.platform)}</small></span>`).join('')}
    </div>`;
  }
  return `<div class="ld-cal">
    <div class="ld-cal-head"><span class="ld-cal-month">${y}年${m + 1}月 · 上线日历</span><span style="color:rgba(246,240,232,.5);font-size:11px;font-weight:800">点击日期查看当日上线</span></div>
    <div class="ld-cal-grid">${dows.map(d => `<div class="ld-cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="ld-cal-detail" id="ldCalDetail"><div class="ld-cal-detail-t">点击任意日期查看当日上线游戏</div></div>
  </div>`;
}

function ldCalSelect(ds) {
  const events = (launchedData.watch && launchedData.watch.calendar) || [];
  const dayEvents = events.filter(e => e.date === ds);
  document.querySelectorAll('.ld-cal-cell').forEach(c => c.classList.toggle('sel', c.dataset.day === ds));
  const box = document.getElementById('ldCalDetail');
  if (!box) return;
  const cn = formatCnDate(ds);
  box.innerHTML = `<div class="ld-cal-detail-t">${cn} · ${dayEvents.length ? `${dayEvents.length} 款` : '无上线安排'}</div>`
    + dayEvents.map(e => `<div class="ld-cal-detail-g">${escapeHtml(e.name)}<small>${escapeHtml(e.type)} · ${escapeHtml(e.platform)}</small></div>`).join('');
}
