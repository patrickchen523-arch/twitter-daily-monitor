<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Twitter监控日报</title>
<style>
:root{
  --bg:#FAFAF8;--card:#FFFFFF;--card-hover:#FFFDF5;
  --border:#E8E4DC;--border-light:#F0ECE4;
  --ink:#1A1A1A;--ink2:#4A4A4A;--ink3:#8A8A8A;
  --gold:#C49B2C;--gold-light:#F5EDD4;--gold-border:#E2D5A0;
  --ai:#6C5CE7;--ai-light:#EEEBFB;--ai-border:#C8BFF5;
  --red:#C0392B;--red-light:#FDEEEC;--red-border:#F0B8B2;
  --green:#27AE60;--green-light:#E8F8F0;--green-border:#A3E4C1;
  --blue:#2980B9;--blue-light:#EBF5FB;--blue-border:#A9D4F0;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);
  --shadow-hover:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 24px 80px}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:920px;margin:0 auto;padding:16px 24px 0}
.masthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.masthead h1{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:.5px}
.masthead h1 span{color:var(--gold)}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:20px;padding:6px 14px;background:var(--card);transition:border-color .2s}
.search:focus-within{border-color:var(--gold)}
.search svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2}
.search input{border:0;background:transparent;outline:0;font-size:13px;color:var(--ink);width:160px}
.search input::placeholder{color:var(--ink3)}

/* Category tabs */
.cat-tabs{display:flex;gap:6px;padding-bottom:12px}
.cat-tab{font-size:13px;font-weight:600;padding:6px 16px;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--ink2);transition:all .2s;text-decoration:none}
.cat-tab:hover{border-color:var(--gold-border);background:var(--gold-light)}
.cat-tab.on{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(196,155,44,.2)}
.cat-tab .count{font-size:11px;opacity:.7;margin-left:4px}

/* Date strip */
.datestrip{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:18px 0 20px;padding:4px 0 12px;scrollbar-width:thin}
.datestrip::-webkit-scrollbar{height:4px}
.datestrip::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.datestrip button{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--ink);font-size:12px;font-weight:600;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;box-shadow:var(--shadow)}
.datestrip button:hover{border-color:var(--gold-border);transform:translateY(-1px)}
.datestrip button.on{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 3px 12px rgba(196,155,44,.25)}
.datestrip button .weekday{font-size:10px;opacity:.6;font-weight:400}
.datestrip button.nodata{opacity:.4;cursor:default;box-shadow:none}
.datestrip button.nodata:hover{border-color:var(--border);transform:none}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:12px;padding:22px 24px;margin:12px 0;transition:all .25s;box-shadow:var(--shadow)}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);border-color:var(--gold-border)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card-idx{font-weight:800;font-size:11px;letter-spacing:.5px;padding:3px 8px;border-radius:4px}
.badge{font-size:10.5px;font-weight:600;color:var(--ink2);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 8px}
.card h2{font-size:16px;margin:6px 0;color:var(--ink);line-height:1.45;font-weight:700}
.card .en-title{font-size:11.5px;color:var(--ink3);font-style:italic;margin-bottom:10px;line-height:1.5}
.card .link{font-size:11.5px;margin:8px 0 12px;word-break:break-all}
.card .link a{color:var(--gold);text-decoration:none;font-weight:500}
.card .link a:hover{text-decoration:underline}
.card .media{margin:14px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border-light)}
.card .media img{width:100%;max-height:360px;object-fit:cover;display:block}
.card .media video{width:100%;max-height:360px;display:block}
.card .field{margin:10px 0}
.card .lab{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;padding:2px 6px;border-radius:3px}
.card .lab.summary{color:var(--gold);background:var(--gold-light)}
.card .lab.analysis{color:var(--blue);background:var(--blue-light)}
.card .val{margin:4px 0 0;color:var(--ink2);font-size:14px;line-height:1.75}

/* Section heading (hidden when tab filtering, shown for "all") */
.sec-heading{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:28px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;color:var(--ink3)}
.sec-dot{width:7px;height:7px;border-radius:50%}

/* Empty / loading */
.loading{text-align:center;color:var(--ink3);padding:60px 0;font-size:14px}
.no-results{text-align:center;color:var(--ink3);padding:40px 0;font-size:14px;display:none}

/* Footer */
footer{margin-top:40px;text-align:center;color:var(--ink3);font-size:11.5px;padding:20px 0;border-top:1px solid var(--border)}

/* Enrichment (indie game extra info) */
.enrichment{margin-top:14px;padding:14px 16px;background:var(--bg);border:1px solid var(--border-light);border-radius:8px}
.enrich-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.enrich-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--green-light);color:var(--green);border:1px solid var(--green-border)}
.enrich-tag.platform{background:var(--blue-light);color:var(--blue);border-color:var(--blue-border)}
.enrich-tag.price{background:var(--gold-light);color:var(--gold);border-color:var(--gold-border)}
.enrich-notable{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:10px;padding-left:10px;border-left:2px solid var(--green)}
.enrich-video-link{display:block;position:relative;margin-top:10px;border-radius:8px;overflow:hidden;max-width:480px}
.enrich-video-link img{width:100%;display:block;border-radius:8px;transition:opacity .2s}
.enrich-video-link:hover img{opacity:.85}
.enrich-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:rgba(0,0,0,.7);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:3px}
.enrich-links{display:flex;gap:10px;margin-top:8px}
.enrich-links a{font-size:12px;font-weight:600;color:var(--gold);text-decoration:none;padding:4px 10px;border:1px solid var(--gold-border);border-radius:6px;transition:.2s}
.enrich-links a:hover{background:var(--gold-light)}

/* Digest */
.digest{background:var(--card);border:1px solid var(--gold-border);border-radius:12px;padding:20px 24px;margin-bottom:24px;box-shadow:0 2px 12px rgba(196,155,44,.06)}
.digest-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.digest-title::before{content:"";display:inline-block;width:16px;height:2px;background:var(--gold);border-radius:1px}
.digest-grid{display:flex;flex-direction:column;gap:12px}
.digest-item{padding:14px 18px;border-radius:8px;border-left:3px solid var(--gold);background:var(--gold-light);cursor:pointer;transition:all .2s}
.digest-item:hover{transform:translateX(2px);box-shadow:0 2px 8px rgba(196,155,44,.1)}
.digest-item .di-label{font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
.digest-item .di-lines{display:flex;flex-direction:column;gap:0}
.di-line{font-size:13px;color:var(--ink2);line-height:1.6;padding:5px 8px;border-radius:4px;cursor:pointer;transition:background .15s}
.di-line:hover{background:rgba(0,0,0,.04)}

@media(max-width:600px){
  .wrap{padding:0 14px 60px}
  .header-inner{padding:12px 14px 0}
  .masthead h1{font-size:16px}
  .cat-tabs{overflow-x:auto;flex-wrap:nowrap;gap:6px;padding-bottom:10px}
  .cat-tab{flex:0 0 auto;font-size:12px;padding:5px 12px;white-space:nowrap}
  .search input{width:110px}
  .card{padding:16px 18px}
  .card h2{font-size:15px}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="masthead">
      <h1>Twitter<span>监控</span>日报</h1>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="搜索条目..." oninput="handleSearch()">
      </div>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
  </div>
</header>

<div class="wrap">
  <div class="datestrip" id="dateStrip"></div>
  <div class="digest" id="digest"></div>
  <div id="content"><div class="loading">加载中...</div></div>
  <div class="no-results" id="noResults">未找到匹配的条目</div>
</div>

<footer>Twitter监控日报 · Game & Tech Daily Monitor</footer>

<script>
const BASE = 'data/';
let manifest = null;
let currentDate = null;
let currentData = null;
let currentTab = 'digest'; // default to digest view

async function init() {
  try {
    const res = await fetch(BASE + 'manifest.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    manifest = await res.json();
    renderDateStrip();
    const latest = manifest.dates[manifest.dates.length - 1];
    await loadDate(latest);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="loading">无法加载数据<br><small style="color:var(--ink3)">${e.message}</small></div>`;
  }
}

function renderDateStrip() {
  const strip = document.getElementById('dateStrip');
  strip.innerHTML = '';
  const available = new Set(manifest.dates);
  // Always show: today back to 14 days ago (or earliest data, whichever is further)
  const today = new Date();
  today.setHours(0,0,0,0);
  const earliest = manifest.dates.length ? new Date(manifest.dates[0]) : today;
  const daysBack = Math.max(14, Math.ceil((today - earliest) / 86400000) + 3);
  const start = new Date(today);
  start.setDate(start.getDate() - daysBack);

  const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
  const dates = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    dates.push(d.toISOString().slice(0, 10));
  }

  dates.forEach(d => {
    const btn = document.createElement('button');
    const dt = new Date(d);
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    const wd = dayNames[dt.getDay()];
    btn.innerHTML = `<span class="weekday">${wd}</span>${mm}-${dd}`;
    btn.title = d;
    btn.dataset.date = d;
    const hasData = available.has(d);
    if (!hasData) {
      btn.classList.add('nodata');
    } else {
      btn.onclick = () => loadDate(d);
    }
    strip.appendChild(btn);
  });

  // Scroll to rightmost (today)
  setTimeout(() => {
    strip.scrollLeft = strip.scrollWidth;
  }, 50);
}

async function loadDate(date) {
  currentDate = date;
  document.querySelectorAll('.datestrip button').forEach(b => {
    b.classList.toggle('on', b.dataset.date === date);
  });
  document.getElementById('content').innerHTML = '<div class="loading">加载中...</div>';

  try {
    const res = await fetch(BASE + date + '.json?v=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    currentData = await res.json();
    renderTabs();
    renderDigest();
    document.getElementById('content').innerHTML = '';
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="loading">该日期暂无数据<br><small style="color:var(--ink3)">${e.message}</small></div>`;
  }
}

function renderTabs() {
  const tabs = document.getElementById('catTabs');
  const total = currentData.sections.reduce((s, sec) => s + sec.items.length, 0);
  let html = `<a class="cat-tab ${currentTab==='digest'?'on':''}" onclick="switchTab('digest')">日精选</a>`;
  currentData.sections.forEach(sec => {
    const active = currentTab === sec.id ? 'on' : '';
    html += `<a class="cat-tab ${active}" onclick="switchTab('${sec.id}')">${sec.title}<span class="count">${sec.items.length}</span></a>`;
  });
  html += `<a class="cat-tab ${currentTab==='all'?'on':''}" onclick="switchTab('all')">全部<span class="count">${total}</span></a>`;
  tabs.innerHTML = html;
}

function renderDigest() {
  const el = document.getElementById('digest');
  if (!currentData.digest || !currentData.digest.length) {
    el.innerHTML = '<div class="loading">暂无当日速览</div>';
    el.style.display = '';
    return;
  }
  el.style.display = '';
  const colorMap = {};
  currentData.sections.forEach(s => { colorMap[s.id] = {color: s.color, title: s.title, count: s.items.length}; });

  const total = currentData.sections.reduce((s, sec) => s + sec.items.length, 0);
  let html = `<div class="digest-title">当日速览 · ${currentDate} · 共 ${total} 条</div><div class="digest-grid">`;
  currentData.digest.forEach(d => {
    const info = colorMap[d.id] || {color: '#C49B2C', title: d.id, count: 0};
    const lines = d.text.split('\n').filter(l => l.trim());
    html += `<div class="digest-item" style="border-left-color:${info.color};background:${info.color}08">
      <div class="di-label" style="color:${info.color}">${info.title} · ${info.count} 篇</div>
      <div class="di-lines">`;
    lines.forEach((line, i) => {
      html += `<div class="di-line" onclick="jumpToCard('${d.id}', ${i})">${line}</div>`;
    });
    html += `</div></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function switchTab(tab, scrollToId) {
  currentTab = tab;
  renderTabs();
  if (tab === 'digest') {
    renderDigest();
    document.getElementById('content').innerHTML = '';
  } else {
    document.getElementById('digest').style.display = 'none';
    renderContent();
    if (scrollToId) {
      setTimeout(() => {
        const el = document.getElementById(scrollToId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 50);
    }
  }
}

function jumpToCard(sectionId, itemIndex) {
  const cardId = `card-${sectionId}-${itemIndex}`;
  switchTab(sectionId, cardId);
}

function renderContent() {
  const container = document.getElementById('content');
  let html = '';

  const sections = currentTab === 'all'
    ? currentData.sections
    : currentData.sections.filter(s => s.id === currentTab);

  sections.forEach(sec => {
    if (currentTab === 'all') {
      html += `<div class="sec-heading"><span class="sec-dot" style="background:${sec.color}"></span>${sec.title} · ${sec.title_en}（${sec.items.length}）</div>`;
    }

    sec.items.forEach((item, itemIdx) => {
      const borderColor = sec.color;
      const idxColor = sec.color;
      const idxBg = sec.color + '12';
      let mediaHtml = '';
      if (item.media) {
        if (item.media.type === 'video') {
          mediaHtml = `<div class="media"><video src="${item.media.url}" controls muted playsinline preload="metadata" referrerpolicy="no-referrer"></video></div>`;
        } else {
          mediaHtml = `<div class="media"><img src="${item.media.url}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`;
        }
      }
      const tagsHtml = item.tags.map(t => `<span class="badge">${t}</span>`).join('');

      html += `
        <article class="card" id="card-${sec.id}-${itemIdx}" style="border-left-color:${borderColor}" data-section="${sec.id}" data-searchable="${(item.title + ' ' + item.summary + ' ' + item.analysis + ' ' + item.en_title + ' ' + item.tags.join(' ')).toLowerCase()}">
          <div class="card-top">
            <span class="card-idx" style="color:${idxColor};background:${idxBg}">${item.idx}</span>
            <span class="badge">${item.source}</span>
            ${tagsHtml}
          </div>
          <h2>${item.title}</h2>
          <div class="en-title">${item.en_title}（@${item.author}，${item.date}，♥${item.likes.toLocaleString()} / 👁${item.views.toLocaleString()}）</div>
          <div class="link"><a href="${item.link}" target="_blank">${item.link.replace('https://','')}</a></div>
          ${mediaHtml}
          <div class="field"><span class="lab summary">摘要</span><p class="val">${item.summary}</p></div>
          <div class="field"><span class="lab analysis">观点解读</span><p class="val">${item.analysis}</p></div>
          ${renderEnrichment(item)}
        </article>`;
    });
  });

  if (!html) html = '<div class="loading">该分类下暂无条目</div>';
  container.innerHTML = html;
  document.getElementById('noResults').style.display = 'none';
}

function renderEnrichment(item) {
  if (!item.enrichment) return '';
  const e = item.enrichment;
  let html = '<div class="enrichment">';

  // Tags row: genre, platforms, price, rating
  html += '<div class="enrich-tags">';
  if (e.genre) html += `<span class="enrich-tag">${e.genre}</span>`;
  if (e.platforms) e.platforms.forEach(p => { html += `<span class="enrich-tag platform">${p}</span>`; });
  if (e.price) html += `<span class="enrich-tag price">${e.price}</span>`;
  if (e.steam_rating) html += `<span class="enrich-tag">${e.steam_rating}</span>`;
  html += '</div>';

  // Why notable
  if (e.why_notable) {
    html += `<div class="enrich-notable">${e.why_notable}</div>`;
  }

  // YouTube embed
  if (e.youtube_video) {
    const vidId = e.youtube_video.match(/[?&]v=([^&]+)/);
    if (vidId) {
      html += `<a class="enrich-video-link" href="${e.youtube_video}" target="_blank">
        <img src="https://img.youtube.com/vi/${vidId[1]}/mqdefault.jpg" alt="视频预览" referrerpolicy="no-referrer">
        <span class="enrich-play">▶</span>
      </a>`;
    } else {
      html += `<div class="enrich-links"><a href="${e.youtube_video}" target="_blank">▶ YouTube 视频</a></div>`;
    }
  }

  // Links row
  let links = '';
  if (e.steam_url) links += `<a href="${e.steam_url}" target="_blank">Steam 页面</a>`;
  if (e.youtube_video && !e.youtube_video.includes('youtube.com/watch')) links += `<a href="${e.youtube_video}" target="_blank">▶ 视频</a>`;
  if (links) html += `<div class="enrich-links">${links}</div>`;

  html += '</div>';
  return html;
}

function handleSearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const cards = document.querySelectorAll('.card');
  let visibleCount = 0;

  if (!query) {
    cards.forEach(c => c.style.display = '');
    document.querySelectorAll('.sec-heading').forEach(s => s.style.display = '');
    document.getElementById('noResults').style.display = 'none';
    return;
  }

  cards.forEach(c => {
    const match = (c.dataset.searchable || '').includes(query);
    c.style.display = match ? '' : 'none';
    if (match) visibleCount++;
  });

  document.querySelectorAll('.sec-heading').forEach(heading => {
    let next = heading.nextElementSibling;
    let hasVisible = false;
    while (next && !next.classList.contains('sec-heading')) {
      if (next.classList.contains('card') && next.style.display !== 'none') { hasVisible = true; break; }
      next = next.nextElementSibling;
    }
    heading.style.display = hasVisible ? '' : 'none';
  });

  document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
}

init();
</script>
</body>
</html>
