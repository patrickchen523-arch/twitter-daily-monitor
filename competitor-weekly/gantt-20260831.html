,"game":"王者荣耀","start":"2026-09-01","end":"长期","name":"【王者荣耀】小王打卡计划·九江文旅跨界企划","detail":"王者荣耀全新文旅跨界企划「小王打卡计划」启程，携不同英雄走入不同地方，探访各地人文风物与文化民俗。首站联动九江文旅，从浔阳江畔的无弦琵琶到杨玉环指尖演绎，呈现民乐之美。","code":"A6","major":"运营活动","cat":"其他活动","collab":"九江文旅","note":"文旅跨界打卡企划，无游戏内玩法/付费"},{"id":8,"game":"王者荣耀","start":"2026-09-04","end":"长期","name":"【王者荣耀】峡谷面包人（关注转发/评论抽奖）","detail":"关注@王者荣耀并转发，随机抽10位送出100Q币；关注并评论，随机抽2位送出绘卷主题挂件悦活盲盒。面包人单张小头像可在评论区保存。","code":"A6","major":"运营活动","cat":"其他活动","collab":"/","note":"微博关注转发/评论抽奖，单向分享非裂变"},{"id":9,"game":"和平精英","start":"2026-09-02","end":"长期","name":"【和平精英】地铁逃生「灾变升级」·冰河禁区新赛季（9.2）","detail":"9月2日12:00冰河禁区全新危机来袭。浩劫噩梦战局风云骤起，两大全新首领强势登场；迷雾荒岛暗藏玄机，豚尔的宝藏玩法解锁，全新豚尔BOSS现世并有鼠鼠小弟掉落；冰河禁区首领形象焕新，异变感染者同步异变升级。全新传世武装「贯日长枪」重磅亮相，首领专属变卖物同步入局；中秋限定活动限时开启，海量全新变卖物、崭新装备加入对局。冰河禁区新开放苏尔南冲突模式，各地图进阶和冲突模式中豚尔宝藏现世、宠物豚鼠惊现对局。","code":"C2","major":"玩法内容","cat":"新玩法/模式","collab":"/","note":"地铁逃生灾变升级新首领/宝藏玩法/冲突模式"},{"id":10,"game":"和平精英","start":"2026-09-02","end":"长期","name":"【和平精英】金秋龙狮城主题海岛焕新（激战金秋 9.2）","detail":"9月2日「激战金秋」全新版本上线，主题海岛「金秋龙狮城」焕新归来。主城区换上金秋盛装，以龙、狮为主题的四大分城区同步上线：乘龙快道飞驰、梅花桩追狮收获丰厚物资；巨龙牵引浮岛现世，云巅激战满载而归；秋风画境祈福有概率复活重返战场；秋风集市猜灯谜、舞龙接龙、围炉煮茶。可驾驶「舞龙醒狮」载具穿云跃岭，巧用同心卷轴与稻草人逆转战局，柿子、柿子头套等秋日特色道具同步登场。","code":"C2","major":"玩法内容","cat":"新玩法/模式","collab":"/","note":"金秋龙狮城主题海岛玩法回归+新道具载具"},{"id":11,"game":"和平精英","start":"2026-09-02","end":"长期","name":"【和平精英】华晨宇读评论见证龙狮城升级（代言营销）","detail":"7733万票，龙狮城登顶《梦中情图回归计划》。9月2日「激战金秋」版本上线之际，品牌代言人华晨宇念出特种兵写给龙狮城的心声，以UGC征集评论+明星代言联动放大新版本主题海岛的情感共鸣与话题声量。","code":"A6","major":"运营活动","cat":"其他活动","collab":"/","note":"华晨宇代言营销+评论征集，代言人非IP联动"},{"id":12,"game":"和平精英","start":"2026-09-03","end":"长期","name":"【和平精英】超体新角色「织羽舞者」登场（故事站）","detail":"9月3日故事站更新，超体新导师「织羽舞者」登场。天才芭蕾舞者千歌化身织羽舞者，主打展翼起舞、心向自由的角色设定——自由不仅是飞向选择的方向，更是带同伴脱离困境。玩家可进入故事站查看其过去剧情。","code":"C1","major":"玩法内容","cat":"新角色/英雄","collab":"/","note":"超体新导师角色织羽舞者，免费获取"},{"id":13,"game":"和平精英","start":"2026-08-31","end":"2026-09-27","name":"【和平精英】琉璃藏宝阁（8.31-9.27，免费向抽奖玩法）","detail":"8月31日上线琉璃藏宝阁，活动持续至9月27日。设四大奖池：黑曜晚宴（本期唯一全新转盘）、无面战甲（返场）、冰河战士（返场）、香桃花海（返场），四套系列全套外观四选一。不靠点券硬抽，通过做任务攒「琉璃币」抽奖，每次开启必得1个奖励，单奖池抽满15次即拿满该池全套外观；琉璃币不清空不过期，未花完可留到下期继续用。攒币途径：每日任务登录游戏每周可完成5次（每周完成登录任务即可稳定拿一套）；限定任务在指定时间邀请1名流失7天及以上的特种兵登录（好友列表或口令码邀请，双方均得琉璃币）。已知数值（以游戏内为准）：每套约280琉璃币、每日登录约15币、召回流失玩家约30币。","code":"A3","major":"运营活动","cat":"活跃/对局任务","collab":"/","note":"琉璃藏宝阁靠任务攒免费琉璃币抽外观"},{"id":14,"game":"和平精英","start":"2026-09-02","end":"2026-10-15","name":"【和平精英】激战金秋新版本创作激励活动","detail":"9月2日-10月15日开启激战金秋创作激励活动。激战补给：完成关注和平精英官微、超话签到、带指定话题发博等任务获得抽奖次数，每日有机会抽取套装-红伞翩翩、套装-极光玫瑰、S12K-霓彩脉冲等好礼。现金创作激励：分三条赛道，在和平精英超话带话题#和平精英金秋龙狮城##和平精英地铁逃生##和平精英超体对抗#发布赛道内容参与评选。","code":"A6","major":"运营活动","cat":"其他活动","collab":"/","note":"激战金秋创作激励UGC征集+任务抽奖"},{"id":15,"game":"和平精英","start":"2026-09-03","end":"长期","name":"【和平精英】2026PEL夏决暨巅峰之夜观赛福利","detail":"2026PEL夏决暨巅峰之夜好礼来袭：全新枪皮肤M249-涂鸦街区免费送；完成登录任务还能额外获得双倍增益次数。以赛事节点的免费枪皮与增益福利拉动观赛与登录活跃。","code":"A4","major":"运营活动","cat":"免费福利","collab":"/","note":"PEL夏决完成登录任务免费送M249枪皮"},{"id":16,"game":"三角洲行动","start":"2026-09-04","end":"长期","name":"【三角洲行动】全面战场新地图「摩格旧城区」（群星赛季 9.4）","detail":"9月4日群星赛季全面战场上线新地图「摩格旧城区」，以高密度城市废墟与狭窄街巷为核心场景。设专属玩法「车队突围行动」：交战进入第三区域时攻方可呼叫车队入场，带来移动重火力与前压部署点，需清除敌人并护送车队至终点；若倒计时归零攻方仍在推进车队则进入背水一战，另有4架黑鹰直升机编队增援作为空中火力与部署点。掌握天网核心机密的哈夫克科学家叛逃，引发两大阵营在摩格市巷战。","code":"C3","major":"玩法内容","cat":"新地图/关卡","collab":"/","note":"全面战场新地图摩格旧城区+车队突围行动"},{"id":17,"game":"三角洲行动","start":"2026-09-04","end":"长期","name":"【三角洲行动】烽火地带长弓溪谷体验焕新+钓鱼玩法（9.4）","detail":"9月4日烽火地带长弓溪谷体验焕新，新增渔夫小屋、北坡岩洞、哈夫克地下船坞三大新区域，老乔、佐拉、唐吉三位新伙伴加入。全新局内行动「悬赏：破浪」登场，可驾驶攻击艇沿河岸寻宝，也可驾驶双人摩托艇破浪寻宝。全新钓鱼玩法上线，常规行动地图水域随时可体验，可选不同鱼竿体验台钓、路亚两种节奏，专属渔获收入图鉴、不占仓库空间，更有鱼竿改造系统可打造满配鱼竿。烽火地带航天基地拉闸点位调整为「三选二」，新增浮力与黑室两处闸点缓解蹲守僵局；新增可互动收藏品轮盘「EDC工具包」。","code":"C2","major":"玩法内容","cat":"新玩法/模式","collab":"/","note":"长弓溪谷焕新+钓鱼/攻击艇新玩法"},{"id":18,"game":"三角洲行动","start":"2026-09-04","end":"长期","name":"【三角洲行动】全新支援型干员「旅人」及新武器登场（9.4）","detail":"9月4日全新支援型干员「旅人」罗温·沃尔什携军犬「四叶」入列：可召唤军犬协同作战，让军犬主动追击范围内最近敌人造成伤害并附加标记，无敌人时跟随干员警戒；可用气雾针剂枪修复友方异常、降低范围内敌方血量上限；对战时可投掷刺激性喷雾为队友战术掩护并令区域内敌人咳嗽掌握情报。全新载具「LSV两栖全地形车」加入。战备投送新增「汤姆逊冲锋枪」（特殊腰射补偿，中近距离压制力强）与「MDR突击步枪」（稳定应对中远距离）。全新红品质物资「经典咖啡机」「鱼月徽权杖」、新赛季收藏品「花小蝶」「炫彩-花小蝶」同步上新。全面战场新增拖拽救援；胜者为王达校官段位即永久解锁，突出贡献玩家显示王牌标记；准星自定义功能上线。","code":"C1","major":"玩法内容","cat":"新角色/英雄","collab":"/","note":"新支援型干员旅人(通行证免费线获取)+新武器"},{"id":19,"game":"三角洲行动","start":"2026-09-04","end":"长期","name":"【三角洲行动】「群星」赛季通行证上线（9.4）","detail":"9月4日群星赛季通行证上线，参与对局提升等级领取奖励。内含全新支援型干员「旅人」（免费线获取）、骇爪-骇客少女、K416突击步枪-骇客少女、防空车-骇客少女、安全箱（可免费获取2*2，或付费解锁2*3，当前赛季可持续使用），还有多款武器外观、载具外观、战备补给。","code":"R5","major":"商业化","cat":"战令月卡","collab":"/","note":"群星赛季通行证(付费解锁进阶奖励)"},{"id":20,"game":"三角洲行动","start":"2026-09-04","end":"长期","name":"【三角洲行动】二洲年登录礼（9.4起）","detail":"9月4日起二洲年登录礼开启，登录即领二洲年限定传说武器外观「AUG突击步枪-金粥年」，以及二洲年限定挂饰、徽章、军牌、名片、头像等纪念奖励。完成干员专属评估任务可解锁新干员限定专属名片与动作。参与长弓溪谷对局领新赛季图灵砖、物流凭证；参与摩格旧城区对局领专属军牌、载具外观；全面战场群星行动积累点数解锁新武器、道具外观、徽章等。","code":"A2","major":"运营活动","cat":"登录签到","collab":"/","note":"二洲年登录即领AUG金粥年传说外观"},{"id":21,"game":"三角洲行动","start":"2026-09-04","end":"2026-09-24","name":"【三角洲行动】洲洲小铺赛季上新（达人带货 9.4-9.24）","detail":"9月4日10:00-9月24日23:59洲洲小铺赛季上新。洲洲小铺是三角洲行动官方授权全平台优质达人的限时带货活动，本次重磅上新S11群星赛季通行证，还有全新传说近战武器重塑捆绑包、3款洲洲小铺专属枪械外观捆绑包及6元小铺专属补给。干员可在抖音、哔哩哔哩、快手、虎牙直播平台的达人入口购买并参与小铺专属首周购后活动。","code":"R1","major":"商业化","cat":"直售外观","collab":"/","note":"洲洲小铺达人带货售卖通行证/捆绑包"},{"id":22,"game":"三角洲行动","start":"2026-09-04","end":"长期","name":"【三角洲行动】典藏外观「疾光魅影」上线（9.4）","detail":"9月4日全新典藏外观「疾光魅影」登场，以极速轰鸣的超跑为设计主题，拥有独特的大排量引擎启动检视动作和独特的枪身开火效果，见证引擎点火的咆哮一瞬。","code":"R1","major":"商业化","cat":"直售外观","collab":"/","note":"典藏外观疾光魅影付费获取"},{"id":23,"game":"三角洲行动","start":"2026-09-04","end":"长期","name":"【三角洲行动】传说近战武器「重塑」上线（9.4）","detail":"9月4日全新传说近战武器「重塑」登场，拥有独特的检视效果与挥刀动作，由老朋友比特亲手打造，未来感造型。作为群星赛季主推的传说品质近战武器，主要通过洲洲小铺「重塑捆绑包」等付费渠道获取，以独特动作表现与造型满足玩家的收藏与个性化需求。","code":"R1","major":"商业化","cat":"直售外观","collab":"/","note":"传说近战武器重塑捆绑包付费获取"},{"id":24,"game":"三角洲行动","start":"2026-09-04","end":"长期","name":"【三角洲行动】主题典藏挂饰「洲年贺礼」上线（9.4）","detail":"9月4日全新主题典藏挂饰「洲年贺礼」惊喜派送，采用盲盒形式，随机开出装着每一位熟悉面孔的挂饰。作为二洲年主题的盲盒式典藏收藏品，以周年角色情怀承载付费收集动力，在战场上为干员提供个性装扮与好心情。","code":"R2","major":"商业化","cat":"抽奖外观","collab":"/","note":"洲年贺礼盲盒式典藏挂饰随机获取"},{"id":25,"game":"三角洲行动","start":"2026-09-04","end":"2026-09-17","name":"【三角洲行动】久久公益节·繁星计划（9.4-9.17）","detail":"9月4日至17日久久公益节开启，参与活动、回顾宝藏月寻宝历程可获腾讯SSV数字文化实验室和御窑博物院认证的「数字守艺人公益证书」。继续体验可参与「繁星计划」，标记文物助力数字文化实验室AI多模态识别，每完成一次任务触发一次公益配捐，通过腾讯基金会支持景德镇御窑博物院文物3D采集与文创开发。首次进入公益专区可获军牌-鲨鳄同心等见面礼，完成繁星计划可领御窑博物院史诗级联动枪械外观「QJB201轻机枪-青锋」。","code":"A3","major":"运营活动","cat":"活跃/对局任务","collab":"景德镇御窑博物院","note":"久久公益节标记文物任务免费领青锋联动外观"},{"id":26,"game":"三角洲行动","start":"2026-09-04","end":"2026-11-04","name":"【三角洲行动】高校认证·打洲社（9.4-11.4）","detail":"9月4日-11月4日，完成高校认证加入打洲社，即可限时免费体验传说近战武器「影锋」与全干员限时全解锁。以开学季高校认证承接学生用户，用免费武器体验与全干员解锁降低新学期回流门槛。","code":"A4","major":"运营活动","cat":"免费福利","collab":"/","note":"高校认证免费限免影锋近战+全干员解锁"},{"id":27,"game":"三角洲行动","start":"2026-09-01","end":"长期","name":"【三角洲行动】三角洲行动×INART 达成合作（外部IP联动）","detail":"《三角洲行动》正式与INART达成合作，更多合作及产品信息将陆续公开。INART为知名收藏级雕像/手办厂商，此合作指向线下实体衍生品方向。","code":"A6","major":"运营活动","cat":"其他活动","collab":"INART","note":"×INART达成合作(收藏级雕像厂商)，暂无落地内容"},{"id":28,"game":"金铲铲之战","start":"2026-09-04","end":"长期","name":"【金铲铲之战】宝宝学院活动（9.4）","detail":"9月4日0点起可前往特惠或事件中心参与「宝宝学院」活动，首轮仅需100点券，首3轮必定解锁传说级竞技场「宝宝学院」或小小英雄「哈姆仓鼠」，6轮（共8800点券）可获得所有奖励。活动结束后，竞技场将以9900点券、小小英雄将以5500点券的价格限时上架商城。","code":"R2","major":"商业化","cat":"抽奖外观","collab":"/","note":"宝宝学院点券付费抽竞技场/小小英雄外观"},{"id":29,"game":"金铲铲之战","start":"2026-08-31","end":"2026-09-06","name":"【金铲铲之战】宝库限时返场（8.31-9.6批次）","detail":"8月31日-9月6日宝库限时返场：至臻·隐龙之子·小小希瓦娜、斗魂觉醒·小小拉克丝、太空律动·小小璐璐、演武场竞技场（消耗紫色宝石兑换）；封印之门竞技场、虎鲸的问候攻击特效返场至9月13日。活动入口游戏主界面-宝库。","code":"R1","major":"商业化","cat":"直售外观","collab":"/","note":"宝库紫色宝石(付费副产物)固定价兑换至臻外观"},{"id":30,"game":"金铲铲之战","start":"2026-09-01","end":"2026-09-24","name":"【金铲铲之战】符石精粹补给活动（9.1-9.24）","detail":"9月1日-9月24日符石精粹补给活动开启。活动期间可在3个指定时段完成登录、对局任务打卡，每累计打卡4次获得2000符石精粹补给，活动累计可获得24000符石精粹补给。活动入口游戏主界面-活动。","code":"A3","major":"运营活动","cat":"活跃/对局任务","collab":"/","note":"符石精粹补给打卡任务免费领游戏内材料"},{"id":31,"game":"金铲铲之战","start":"2026-09-01","end":"长期","name":"【金铲铲之战】高校认证·录取 const GAMES = ["王者荣耀","和平精英","三角洲行动","金铲铲之战","超自然行动组","洛克王国世界","原神","恋与深空","三国谋定天下"];
const RANGE_START = '2026-08-31', RANGE_END = '2026-09-28';
const WEEK_S = '2026-08-31', WEEK_E = '2026-09-06';
let COL_W = 34;
/* 手机端窄标签列，render时按当前宽度重算 */
let MAJOR_W = 46, CAT_W = 132, LABEL_W = MAJOR_W + CAT_W;
function measureLabels(){
  const n = document.documentElement.clientWidth <= 680;
  MAJOR_W = n ? 30 : 46; CAT_W = n ? 40 : 132; LABEL_W = MAJOR_W + CAT_W;
}
const BAR_H = 26, BAR_GAP = 4, BAND_PAD = 5;
const DAY = 86400000;

const MAJOR_ORDER = ['商业化', '玩法内容', '运营活动'];
const MAJOR_COLORS = { '商业化': '#A46312', '玩法内容': '#2D6B91', '运营活动': '#AE4C4C', '待核对': '#7f7f7f' };
const CAT_ORDER = {};
['R1','R2','R3','R4','R5','R6','R7'].forEach((c,i)=>CAT_ORDER[c]=i);
['C1','C2','C3','C4','C5','C6'].forEach((c,i)=>CAT_ORDER['X'+c]=i);
['A1','A2','A3','A4','A5','A6'].forEach((c,i)=>CAT_ORDER['Y'+c]=i);

let d0, d1, NDAYS, TRACK_W;
/* 全端均显示完整区间；手机端列宽固定、图板横向滑动查看后续日期 */
function setRange(){
  d0 = new Date(RANGE_START + 'T00:00:00');
  d1 = new Date(RANGE_END + 'T00:00:00');
  NDAYS = Math.round((d1 - d0) / DAY) + 1;
  TRACK_W = NDAYS * COL_W;
}
setRange();

function parse(s){ return new Date(s + 'T00:00:00'); }
function dayIdx(s){ return Math.round((parse(s) - d0) / DAY); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fmt(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const state = { games: new Set(GAMES), majors: new Set(MAJOR_ORDER) };

/* ---- date header ---- */
function buildHead(){
  const h = document.createElement('div'); h.className = 'dhead';
  const mrow = document.createElement('div'); mrow.className = 'dhead-row months';
  const corner1 = document.createElement('div'); corner1.className = 'corner';
  corner1.style.cssText = 'width:' + LABEL_W + 'px;min-width:' + LABEL_W + 'px;grid-row:span 2;';
  corner1.textContent = document.documentElement.clientWidth <= 680 ? '分类/日期' : '分类 / 日期';
  corner1.style.gridRow = 'span 2';
  mrow.appendChild(corner1);
  // months spanning
  let mi = 0;
  while (mi < NDAYS) {
    const d = new Date(d0.getTime() + mi * DAY);
    const y = d.getFullYear(), m = d.getMonth();
    let span = 0;
    while (mi + span < NDAYS) {
      const dd = new Date(d0.getTime() + (mi + span) * DAY);
      if (dd.getFullYear() === y && dd.getMonth() === m) span++; else break;
    }
    const c = document.createElement('div'); c.className = 'mcell';
    c.style.width = span * COL_W + 'px'; c.textContent = y + '年' + (m+1) + '月';
    mrow.appendChild(c); mi += span;
  }
  h.appendChild(mrow);
  const drow = document.createElement('div'); drow.className = 'dhead-row days';
  const corner2 = document.createElement('div'); corner2.className = 'corner';
  corner2.style.cssText = 'width:' + LABEL_W + 'px;min-width:' + LABEL_W + 'px;font-size:11px;';
  corner2.textContent = document.documentElement.clientWidth <= 680
    ? (d0.getMonth()+1) + '/' + d0.getDate() + ' ~ ' + (d1.getMonth()+1) + '/' + d1.getDate()
    : RANGE_START + ' ~ ' + RANGE_END;
  drow.appendChild(corner2);
  for (let i = 0; i < NDAYS; i++) {
    const d = new Date(d0.getTime() + i * DAY);
    const s = fmt(d);
    const c = document.createElement('div'); c.className = 'dcell';
    c.style.width = COL_W + 'px';
    if (s >= WEEK_S && s <= WEEK_E) c.classList.add('wk');
    if (d.getDay() === 0 || d.getDay() === 6) c.classList.add('wkend');
    /* 手机端列宽足够：每天显示日号，月份看上行月标题 */
    c.textContent = document.documentElement.clientWidth <= 680
      ? String(d.getDate())
      : (d.getMonth()+1) + '/' + d.getDate();
    drow.appendChild(c);
  }
  h.appendChild(drow);
  return h;
}

/* ---- gantt body ---- */
function laneCount(items){
  // greedy lane assignment, returns total lanes
  const lanes = [];
  const sorted = [...items].sort((a,b) => a._si - b._si || a._ei - b._ei);
  sorted.forEach(it => {
    let placed = false;
    for (let l = 0; l < lanes.length; l++) {
      if (lanes[l] <= it._si) { it._lane = l; lanes[l] = it._ei + 1; placed = true; break; }
    }
    if (!placed) { it._lane = lanes.length; lanes.push(it._ei + 1); }
  });
  return Math.max(lanes.length, 1);
}

function render(){
  measureLabels();
  const narrow = document.documentElement.clientWidth <= 680;
  setRange();
  // 桌面端按宽度铺满；手机端列宽固定44px，图板横向滑动（初始停留在本周）
  COL_W = narrow ? 44 : Math.max(10, Math.floor((document.documentElement.clientWidth - LABEL_W - 4) / NDAYS));
  TRACK_W = NDAYS * COL_W;
  const visible = DATA.filter(r => state.games.has(r.game) && state.majors.has(r.major));
  visible.forEach(r => {
    r._si = Math.max(0, dayIdx(r.start));
    r._ei = r.end === '长期' ? NDAYS - 1 : Math.min(NDAYS - 1, dayIdx(r.end));
    if (r._ei < r._si) r._ei = r._si;
  });
  const inner = document.getElementById('inner');
  inner.innerHTML = '';
  inner.style.width = LABEL_W + TRACK_W + 'px';
  inner.appendChild(buildHead());

  MAJOR_ORDER.forEach(major => {
    if (!state.majors.has(major)) return;
    const inMajor = visible.filter(r => r.major === major);
    if (!inMajor.length) return;
    // group by category
    const cats = {};
    inMajor.forEach(r => {
      // code empty → merge into band with same cat-name if exists, else 待核对 band
      let key = r.code ? r.code + ' ' + r.cat : '待核对';
      if (!r.code) {
        const hit = inMajor.find(o => o.major === r.major && o.cat === r.cat && o.code);
        if (hit) key = hit.code + ' ' + hit.cat;
      }
      (cats[key] = cats[key] || []).push(r);
    });
    const catKeys = Object.keys(cats).sort((a,b) => {
      const ca = a.slice(0,2), cb = b.slice(0,2);
      return (CAT_ORDER[ca] !== undefined ? CAT_ORDER[ca] : 99) - (CAT_ORDER[cb] !== undefined ? CAT_ORDER[cb] : 99);
    });

    const g = document.createElement('div'); g.className = 'group mj-' + major;
    const ml = document.createElement('div'); ml.className = 'major-label';
    ml.style.width = MAJOR_W + 'px'; ml.style.minWidth = MAJOR_W + 'px';
    ml.textContent = major;
    g.appendChild(ml);
    const bands = document.createElement('div'); bands.className = 'bands';

    catKeys.forEach(ck => {
      const items = cats[ck];
      const nLanes = laneCount(items);
      const bandH = nLanes * (BAR_H + BAR_GAP) + BAND_PAD * 2;
      const band = document.createElement('div'); band.className = 'band'; band.style.height = bandH + 'px';
      const cl = document.createElement('div'); cl.className = 'cat-label';
      cl.style.left = MAJOR_W + 'px'; cl.style.width = CAT_W + 'px'; cl.style.minWidth = CAT_W + 'px';
      const nm = items[0].cat;
      cl.innerHTML = '<span class="nm">' + esc(nm) + '</span>';
      band.appendChild(cl);
      const track = document.createElement('div'); track.className = 'track';
      track.style.width = TRACK_W + 'px'; track.style.backgroundSize = COL_W + 'px 100%';
      // week highlight
      const wm = document.createElement('div'); wm.className = 'weekmark';
      wm.style.left = dayIdx(WEEK_S) * COL_W + 'px';
      wm.style.width = (dayIdx(WEEK_E) - dayIdx(WEEK_S) + 1) * COL_W + 'px';
      track.appendChild(wm);
      // bars
      items.forEach(r => {
        const b = document.createElement('div');
        b.className = 'bar mj-' + r.major + (r.end === '长期' ? ' open' : '') + (r.code ? '' : ' uncode');
        b.style.left = r._si * COL_W + 2 + 'px';
        b.style.width = (r._ei - r._si + 1) * COL_W - 5 + 'px';
        b.style.top = BAND_PAD + r._lane * (BAR_H + BAR_GAP) + 'px';
        b.title = r.name + '　' + r.start + ' ~ ' + r.end;
        b.innerHTML = (r.collab && r.collab !== '/' ? '<span class="clb">联动·' + esc(r.collab) + '</span>' : '')
                    + esc(r.name);
        b.onclick = (ev) => { ev.stopPropagation(); selectBar(r.id); };
        b.dataset.id = r.id;
        track.appendChild(b);
      });
      band.appendChild(track);
      bands.appendChild(band);
    });
    g.appendChild(bands);
    inner.appendChild(g);
  });

  // today line (overlay in first track area of whole inner)
  const today = new Date(); today.setHours(0,0,0,0);
  if (today >= d0 && today <= d1) {
    const tl = document.createElement('div'); tl.className = 'today';
    tl.style.left = LABEL_W + Math.round((today - d0) / DAY) * COL_W + 'px';
    tl.innerHTML = '<span>今天</span>';
    tl.style.height = inner.scrollHeight + 'px';
    inner.appendChild(tl);
  }
  // week tag on head
  const wt = document.createElement('div'); wt.className = 'weektag';
  wt.style.left = LABEL_W + dayIdx(WEEK_S) * COL_W + 4 + 'px';
  wt.textContent = '本周 ' + WEEK_S.slice(5) + ' ~ ' + WEEK_E.slice(5);
  document.getElementById('inner').appendChild(wt);
}

function selectBar(id){
  document.querySelectorAll('.bar.sel').forEach(b => b.classList.remove('sel'));
  const el = document.querySelector('.bar[data-id="' + id + '"]');
  if (el) el.classList.add('sel');
  const r = DATA.find(x => x.id === id);
  const mc = MAJOR_COLORS[r.major];
  document.getElementById('modal').innerHTML =
    '<button class="x" onclick="closeModal()">×</button>' +
    '<h2>' + esc(r.name) + '</h2>' +
    '<div class="meta"><span class="tag" style="background:' + mc + ';color:#fff">' + esc(r.major) + '</span>' +
    '<span class="tag" style="background:#eef2f7;color:#374151">' + esc(r.code || '—') + ' ' + esc(r.cat) + '</span></div>' +
    '<div class="meta">🎮 ' + esc(r.game) + '　⏱ ' + esc(r.start) + ' ~ ' + esc(r.end === '长期' ? '长期/结束时间未知' : r.end) + '</div>' +
    (r.collab && r.collab !== '/' ? '<div class="sec">🔗 IP联动</div><div class="collab">' + esc(r.collab) + '</div>' : '') +
    '<div class="sec">📄 详细内容</div><div class="ct">' + esc(r.detail) + '</div>';
  const mask = document.getElementById('mask');
  mask.classList.add('show');
  // 弹窗定位到所点甘特条下方；空间不足则放到上方
  const modal = document.getElementById('modal');
  const rect = el ? el.getBoundingClientRect() : null;
  const docW = document.documentElement.clientWidth;
  const docH = document.documentElement.scrollHeight;
  const mw = modal.offsetWidth, mh = modal.offsetHeight;
  if (!rect) {
    // 手机端卡片列表无甘特条元素，弹窗定位于当前视口上部居中
    modal.style.left = Math.max(8, (docW - mw) / 2) + 'px';
    modal.style.top = (window.scrollY + 60) + 'px';
    return;
  }
  const barTop = rect.top + window.scrollY, barBottom = rect.bottom + window.scrollY;
  let left = rect.left + window.scrollX;
  left = Math.max(8, Math.min(left, docW - mw - 8));
  let top = barBottom + 6;
  if (top + mh > docH - 8) top = Math.max(8, barTop - mh - 6);
  modal.style.left = left + 'px';
  modal.style.top = top + 'px';
}
function closeModal(){
  document.getElementById('mask').classList.remove('show');
  document.querySelectorAll('.bar.sel').forEach(b => b.classList.remove('sel'));
}
document.getElementById('mask').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

/* ---- toolbar ---- */
const gc = document.getElementById('gameChips');
GAMES.forEach(g => {
  const c = document.createElement('span'); c.className = 'chip on'; c.textContent = g;
  c.onclick = () => { if (state.games.has(g)) { state.games.delete(g); c.classList.remove('on'); } else { state.games.add(g); c.classList.add('on'); } render(); };
  gc.appendChild(c);
});
document.getElementById('allG').onclick = () => { GAMES.forEach(g => state.games.add(g)); gc.querySelectorAll('.chip').forEach(c => c.classList.add('on')); render(); };
document.getElementById('noG').onclick = () => { state.games.clear(); gc.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); render(); };

const mc = document.getElementById('mjChips');
MAJOR_ORDER.forEach(m => {
  const c = document.createElement('span'); c.className = 'chip mj-on'; c.textContent = m;
  c.style.background = MAJOR_COLORS[m]; c.style.borderColor = MAJOR_COLORS[m];
  c.onclick = () => {
    if (state.majors.has(m)) { state.majors.delete(m); c.style.background = '#f3f4f6'; c.style.color = '#374151'; c.classList.remove('mj-on'); }
    else { state.majors.add(m); c.style.background = MAJOR_COLORS[m]; c.style.color = '#fff'; c.classList.add('mj-on'); }
    render();
  };
  mc.appendChild(c);
});

window.addEventListener('resize', () => render());

function reportHeight(){
  if (window.parent !== window) {
    window.parent.postMessage({ ganttHeight: document.documentElement.scrollHeight }, '*');
  }
}
new MutationObserver(() => setTimeout(reportHeight, 50)).observe(document.body, { childList: true, subtree: true });
window.addEventListener('load', reportHeight);

render();
reportHeight();
</script>
</body>
